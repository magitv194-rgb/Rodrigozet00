              private fun applyTtsSettings() {
                  try {
                      tts?.language = targetLocale
                      tts?.setSpeechRate(settings.ttsSpeed)
                      val voices = tts?.voices ?: return
                      val best = voices.filter { it.locale.language == targetLocale.language }
                          .maxByOrNull { it.quality }
                      if (best != null && !best.isNetworkConnectionRequired) tts?.voice = best
                  } catch (_: Exception) {}
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) return START_NOT_STICKY
                  cleanup()
                  running.set(true)
                  settings = AppSettings(this)

                  val source = LANGS[settings.sourceLang] ?: LANGS.values.first()
                  val target = LANGS[settings.targetLang] ?: LANGS.values.first()
                  targetLocale = target.ttsLocale
                  sessionStart = System.currentTimeMillis()
                  lastFinalTime = sessionStart
                  lastOriginal = ""
                  lastTranslated = null
                  lastRecognized = ""
                  lastPartialText = ""
                  modelReady = false
                  subtitleLog.clear()

                  startForegroundNotification()

                  val data = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra("projectionData", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION") intent.getParcelableExtra<Intent>("projectionData")
                  }
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  projection = getSystemService(MediaProjectionManager::class.java)
                      .getMediaProjection(intent.getIntExtra("resultCode", 0), data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, mainHandler)

                  if (tts == null) tts = TextToSpeech(this, this) else applyTtsSettings()
                  createOverlay()

                  if (source.translateCode == target.translateCode) {
                      modelReady = true
                  } else if (settings.translatorMode == "deepl" && settings.deeplApiKey.isNotBlank()) {
                      deepL = DeepLClient(settings.deeplApiKey)
                      modelReady = true
                      showSubtitle(getString(R.string.msg_listening_plus))
                  } else {
