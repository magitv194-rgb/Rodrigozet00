name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/subtitulos/live app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SubtitulosLive"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.subtitulos.live"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.subtitulos.live"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.alphacephei:vosk-android:0.3.75@aar")
              implementation("net.java.dev.jna:jna:5.14.0@aar")
              implementation("com.google.mlkit:translate:17.0.3")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Subtítulos Live</string></resources>
          EOF

          cat > app/src/main/java/com/subtitulos/live/Languages.kt <<'EOF'
          package com.subtitulos.live

          data class Language(val name: String, val voskModel: String, val mlKit: String)

          object Languages {
              val all = listOf(
                  Language("Español", "vosk-model-small-es-0.42", "es"),
                  Language("Inglés", "vosk-model-small-en-us-0.15", "en"),
                  Language("Alemán", "vosk-model-small-de-0.15", "de"),
                  Language("Coreano", "vosk-model-small-ko-0.22", "ko"),
                  Language("Portugués", "vosk-model-small-pt-0.3", "pt"),
                  Language("Francés", "vosk-model-small-fr-0.22", "fr"),
                  Language("Italiano", "vosk-model-small-it-0.22", "it"),
                  Language("Japonés", "vosk-model-small-ja-0.22", "ja"),
                  Language("Ruso", "vosk-model-small-ru-0.22", "ru"),
                  Language("Chino", "vosk-model-small-cn-0.22", "zh")
              )
          }
          EOF

          cat > app/src/main/java/com/subtitulos/live/MainActivity.kt <<'EOF'
          package com.subtitulos.live

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : Activity() {
              private val projectionRequest = 4102
              private val permissionRequest = 4103
              private lateinit var source: Spinner
              private lateinit var target: Spinner
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 32, 28, 24)
                  }
                  layout.addView(TextView(this).apply {
                      text = "Subtítulos Live"
                      textSize = 26f
                  })
                  layout.addView(TextView(this).apply {
                      text = "Idioma del audio"
                      textSize = 16f
                      setPadding(0, 24, 0, 6)
                  })
                  source = Spinner(this)
                  target = Spinner(this)
                  val names = Languages.all.map { it.name }
                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, names)
                  source.adapter = adapter
                  target.adapter = adapter
                  source.setSelection(0)
                  target.setSelection(1)
                  layout.addView(source)
                  layout.addView(TextView(this).apply {
                      text = "Traducir al idioma"
                      textSize = 16f
                      setPadding(0, 18, 0, 6)
                  })
                  layout.addView(target)
                  val start = Button(this).apply {
                      text = "Iniciar subtítulos"
                      setOnClickListener { prepareStart() }
                  }
                  layout.addView(start)
                  layout.addView(Button(this).apply {
                      text = "Detener subtítulos"
                      setOnClickListener { stopService(Intent(this@MainActivity, CaptureService::class.java)) }
                  })
                  status = TextView(this).apply {
                      text = "Elegí los idiomas y tocá Iniciar. Permití la captura de audio cuando Android lo solicite."
                      textSize = 14f
                      setPadding(0, 20, 0, 0)
                  }
                  layout.addView(status)
                  setContentView(ScrollView(this).apply { addView(layout) })
              }

              private fun prepareStart() {
                  val permissions = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != android.content.pm.PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), permissionRequest)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      status.text = "Concedé el permiso para mostrar la ventana flotante y luego volvé a iniciar."
                      return
                  }
                  val manager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(manager.createScreenCaptureIntent(), projectionRequest)
              }

              @Deprecated("Deprecated by Android, retained for broad device compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == projectionRequest && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, CaptureService::class.java).apply {
                          action = CaptureService.ACTION_START
                          putExtra(CaptureService.EXTRA_RESULT_CODE, resultCode)
                          putExtra(CaptureService.EXTRA_DATA, data)
                          putExtra(CaptureService.EXTRA_SOURCE, source.selectedItemPosition)
                          putExtra(CaptureService.EXTRA_TARGET, target.selectedItemPosition)
                      }
                      ContextCompat.startForegroundService(this, intent)
                      status.text = "Servicio iniciado. Abrí una app con audio multimedia compatible con captura."
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == permissionRequest && grantResults.isNotEmpty() &&
                      grantResults.all { it == android.content.pm.PackageManager.PERMISSION_GRANTED }) prepareStart()
                  else status.text = "Faltan permisos necesarios para iniciar."
              }
          }
          EOF

          cat > app/src/main/java/com/subtitulos/live/CaptureService.kt <<'EOF'
          package com.subtitulos.live

          import android.app.*
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import com.alphacephei.vosk.Model
          import com.alphacephei.vosk.Recognizer
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import com.google.mlkit.common.model.DownloadConditions
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.zip.ZipInputStream

          class CaptureService : Service(), TextToSpeech.OnInitListener {
              companion object {
                  const val ACTION_START = "com.subtitulos.live.START"
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_DATA = "projectionData"
                  const val EXTRA_SOURCE = "source"
                  const val EXTRA_TARGET = "target"
                  private const val CHANNEL = "subtitulos_live"
              }

              private val alive = AtomicBoolean(false)
              private val worker = Executors.newSingleThreadExecutor()
              private val translatorWorker = Executors.newSingleThreadExecutor()
              private var projection: MediaProjection? = null
              private var recorder: AudioRecord? = null
              private var recognizer: Recognizer? = null
              private var model: Model? = null
              private var translator: Translator? = null
              private var sourceLang = Languages.all[0]
              private var targetLang = Languages.all[1]
              private var window: WindowManager? = null
              private var overlay: LinearLayout? = null
              private var caption: TextView? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var speakEnabled = false
              private var speechVolume = 0.8f
              private var lastFinal = ""
              private var lastPartial = ""
              private var pendingText = ""
              private var translating = false
              private var textSize = 18f

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  tts = TextToSpeech(this, this)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action != ACTION_START) return START_NOT_STICKY
                  startForeground(7, notification())
                  val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                  @Suppress("DEPRECATION")
                  val data = if (Build.VERSION.SDK_INT >= 33) intent.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                             else intent.getParcelableExtra(EXTRA_DATA)
                  if (data == null || resultCode != Activity.RESULT_OK) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  sourceLang = Languages.all[intent.getIntExtra(EXTRA_SOURCE, 0).coerceIn(0, Languages.all.lastIndex)]
                  targetLang = Languages.all[intent.getIntExtra(EXTRA_TARGET, 1).coerceIn(0, Languages.all.lastIndex)]
                  if (sourceLang.mlKit == targetLang.mlKit) {
                      targetLang = Languages.all[(Languages.all.indexOf(sourceLang) + 1) % Languages.all.size]
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  showOverlay()
                  val manager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = manager.getMediaProjection(resultCode, data)
                  if (projection == null) {
                      updateCaption("No se pudo iniciar la captura de audio.")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  alive.set(true)
                  worker.execute { loadModelAndCapture() }
                  return START_NOT_STICKY
              }

              private fun loadModelAndCapture() {
                  try {
                      updateCaption("Descargando modelo de ${sourceLang.name}…")
                      val modelDir = ensureModel(sourceLang.voskModel)
                      val loaded = Model(modelDir.absolutePath)
                      model = loaded
                      recognizer = Recognizer(loaded, 16000.0f)
                      prepareTranslator()
                      updateCaption("Listo. Reproducí audio en una app compatible.")
                      captureLoop()
                  } catch (e: Exception) {
                      updateCaption("Error al preparar reconocimiento: ${e.message ?: "desconocido"}")
                      stopCapture()
                  }
              }

              private fun ensureModel(modelName: String): File {
                  val root = File(filesDir, "vosk").apply { mkdirs() }
                  val destination = File(root, modelName)
                  if (File(destination, "am").exists() && File(destination, "conf").exists()) return destination
                  val zipFile = File(root, "$modelName.zip")
                  val url = URL("https://alphacephei.com/vosk/models/$modelName.zip")
                  val connection = (url.openConnection() as HttpURLConnection).apply {
                      connectTimeout = 20000
                      readTimeout = 60000
                      instanceFollowRedirects = true
                  }
                  try {
                      connection.connect()
                      if (connection.responseCode !in 200..299) throw IllegalStateException("No se pudo descargar el modelo (${connection.responseCode})")
                      connection.inputStream.use { input ->
                          FileOutputStream(zipFile).use { output -> input.copyTo(output) }
                      }
                  } finally { connection.disconnect() }
                  val temp = File(root, "${modelName}_extract").apply {
                      deleteRecursively()
                      mkdirs()
                  }
                  ZipInputStream(zipFile.inputStream().buffered()).use { zis ->
                      var entry = zis.nextEntry
                      while (entry != null) {
                          val out = File(temp, entry.name)
                          if (!out.canonicalPath.startsWith(temp.canonicalPath + File.separator)) {
                              throw SecurityException("Ruta inválida en el modelo")
                          }
                          if (entry.isDirectory) out.mkdirs() else {
                              out.parentFile?.mkdirs()
                              FileOutputStream(out).use { stream -> zis.copyTo(stream) }
                          }
                          zis.closeEntry()
                          entry = zis.nextEntry
                      }
                  }
                  val extracted = temp.listFiles()?.firstOrNull { it.isDirectory && File(it, "am").exists() }
                      ?: if (File(temp, "am").exists()) temp else throw IllegalStateException("El ZIP no contiene un modelo Vosk válido")
                  if (destination.exists()) destination.deleteRecursively()
                  if (extracted == temp) {
                      if (!temp.renameTo(destination)) throw IllegalStateException("No se pudo instalar el modelo")
                  } else {
                      if (!extracted.renameTo(destination)) throw IllegalStateException("No se pudo instalar el modelo")
                  }
                  zipFile.delete()
                  temp.deleteRecursively()
                  return destination
              }

              private fun prepareTranslator() {
                  if (sourceLang.mlKit == targetLang.mlKit) return
                  val options = TranslatorOptions.Builder()
                      .setSourceLanguage(sourceLang.mlKit)
                      .setTargetLanguage(targetLang.mlKit)
                      .build()
                  val client = Translation.getClient(options)
                  translator = client
                  try {
                      client.downloadModelIfNeeded(DownloadConditions.Builder().build()).addOnFailureListener {
                          updateCaption("No se pudo descargar el paquete de traducción: ${it.message}")
                      }
                  } catch (_: Exception) { }
              }

              private fun captureLoop() {
                  val p = projection ?: throw IllegalStateException("Captura no disponible")
                  val config = AudioPlaybackCaptureConfiguration.Builder(p)
                      .addMatchingUsage(android.media.AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(android.media.AudioAttributes.USAGE_GAME)
                      .build()
                  val minBuffer = AudioRecord.getMinBufferSize(
                      16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuffer <= 0) throw IllegalStateException("Formato de audio no compatible")
                  val bufferSize = maxOf(minBuffer * 2, 6400)
                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(16000)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()
                  val audio = AudioRecord.Builder()
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(bufferSize)
                      .setAudioPlaybackCaptureConfig(config)
                      .build()
                  recorder = audio
                  if (audio.state != AudioRecord.STATE_INITIALIZED) throw IllegalStateException("No se pudo inicializar AudioRecord")
                  audio.startRecording()
                  val buffer = ByteArray(3200)
                  while (alive.get()) {
                      val count = audio.read(buffer, 0, buffer.size)
                      if (count > 0) {
                          val r = recognizer ?: break
                          if (r.acceptWaveForm(buffer, count)) {
                              val result = parseText(r.result)
                              if (result.isNotBlank()) acceptFinal(result)
                          } else {
                              val partial = parsePartial(r.partialResult)
                              if (partial.isNotBlank()) showPartial(partial)
                          }
                      } else if (count < 0) {
                          Thread.sleep(40)
                      }
                  }
              }

              private fun parseText(json: String): String =
                  try { JSONObject(json).optString("text").trim() } catch (_: Exception) { "" }

              private fun parsePartial(json: String): String =
                  try { JSONObject(json).optString("partial").trim() } catch (_: Exception) { "" }

              private fun showPartial(text: String) {
                  if (text == lastPartial || text == lastFinal) return
                  lastPartial = text
                  updateCaption(text)
              }

              private fun acceptFinal(text: String) {
                  if (text.isBlank() || text == lastFinal) return
                  lastFinal = text
                  lastPartial = ""
                  if (sourceLang.mlKit == targetLang.mlKit) {
                      updateCaption(text)
                      speak(text)
                      return
                  }
                  synchronized(this) {
                      pendingText = (pendingText + " " + text).trim()
                      if (translating) return
                      translating = true
                  }
                  translatorWorker.execute { translateNext() }
              }

              private fun translateNext() {
                  val text: String
                  synchronized(this) {
                      text = pendingText
                      pendingText = ""
                  }
                  val client = translator
                  if (client == null || text.isBlank()) {
                      updateCaption(text)
                      synchronized(this) { translating = false }
                      return
                  }
                  client.translate(text)
                      .addOnSuccessListener { translated ->
                          updateCaption(translated)
                          speak(translated)
                          synchronized(this) {
                              if (pendingText.isNotBlank()) translatorWorker.execute { translateNext() }
                              else translating = false
                          }
                      }
                      .addOnFailureListener {
                          updateCaption("Error de traducción. Revisá la conexión.")
                          synchronized(this) {
                              if (pendingText.isNotBlank()) translatorWorker.execute { translateNext() }
                              else translating = false
                          }
                      }
              }

              private fun showOverlay() {
                  window = getSystemService(WINDOW_SERVICE) as WindowManager
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(14, 10, 14, 10)
                      setBackgroundColor(0xDD101820.toInt())
                  }
                  val label = TextView(this).apply {
                      text = "Esperando audio…"
                      setTextColor(0xFFFFFFFF.toInt())
                      this.textSize = this@CaptureService.textSize
                  }
                  caption = label
                  panel.addView(label)
                  val controls = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  controls.addView(Button(this).apply {
                      text = "A−"
                      setOnClickListener { textSize = (textSize - 2f).coerceAtLeast(12f); label.textSize = textSize }
                  })
                  controls.addView(Button(this).apply {
                      text = "A+"
                      setOnClickListener { textSize = (textSize + 2f).coerceAtMost(34f); label.textSize = textSize }
                  })
                  controls.addView(Button(this).apply {
                      text = "Voz: OFF"
                      setOnClickListener {
                          speakEnabled = !speakEnabled
                          text = if (speakEnabled) "Voz: ON" else "Voz: OFF"
                      }
                  })
                  panel.addView(controls)
                  val volume = SeekBar(this).apply {
                      max = 100
                      progress = 80
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              speechVolume = progress / 100f
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  panel.addView(volume)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 90
                  }
                  panel.setOnTouchListener(object : View.OnTouchListener {
                      private var downX = 0f
                      private var downY = 0f
                      private var startX = 0
                      private var startY = 0
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  downX = event.rawX; downY = event.rawY
                                  startX = params.x; startY = params.y
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = startX + (event.rawX - downX).toInt()
                                  params.y = startY + (event.rawY - downY).toInt()
                                  try { window?.updateViewLayout(panel, params) } catch (_: Exception) {}
                                  return true
                              }
                          }
                          return false
                      }
                  })
                  overlay = panel
                  window?.addView(panel, params)
              }

              private fun updateCaption(text: String) {
                  android.os.Handler(mainLooper).post {
                      try { caption?.text = text } catch (_: Exception) {}
                  }
              }

              private fun speak(text: String) {
                  if (!speakEnabled || !ttsReady || text.isBlank()) return
                  val params = Bundle().apply { putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, speechVolume) }
                  tts?.speak(text, TextToSpeech.QUEUE_ADD, params, "subtitle-${System.nanoTime()}")
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      ttsReady = true
                      tts?.language = Locale.getDefault()
                  }
              }

              private fun notification(): Notification =
                  NotificationCompat.Builder(this, CHANNEL)
                      .setContentTitle("Subtítulos Live")
                      .setContentText("Capturando audio multimedia compatible")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(CHANNEL, "Subtítulos Live", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun stopCapture() {
                  alive.set(false)
                  try { recorder?.stop() } catch (_: Exception) {}
                  try { recorder?.release() } catch (_: Exception) {}
                  recorder = null
                  try { recognizer?.close() } catch (_: Exception) {}
                  recognizer = null
                  try { model?.close() } catch (_: Exception) {}
                  model = null
                  try { translator?.close() } catch (_: Exception) {}
                  translator = null
                  try { projection?.stop() } catch (_: Exception) {}
                  projection = null
                  android.os.Handler(mainLooper).post {
                      try { overlay?.let { window?.removeView(it) } } catch (_: Exception) {}
                      overlay = null
                      caption = null
                  }
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  stopCapture()
                  try { tts?.stop(); tts?.shutdown() } catch (_: Exception) {}
                  worker.shutdownNow()
                  translatorWorker.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosLive-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
