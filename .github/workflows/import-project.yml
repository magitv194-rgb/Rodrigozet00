          cat > app/src/main/java/com/subtitulos/live/Languages.kt <<'__EOF__'
          package com.subtitulos.live

          import com.google.mlkit.nl.translate.TranslateLanguage

          data class LanguageOption(
              val code: String,
              val model: String,
              val translateCode: String
          )

          val LANGS = linkedMapOf(
              "Español" to LanguageOption("es", "vosk-model-small-es-0.42", TranslateLanguage.SPANISH),
              "Inglés" to LanguageOption("en", "vosk-model-small-en-us-0.15", TranslateLanguage.ENGLISH),
              "Alemán" to LanguageOption("de", "vosk-model-small-de-0.15", TranslateLanguage.GERMAN),
              "Coreano" to LanguageOption("ko", "vosk-model-small-ko-0.22", TranslateLanguage.KOREAN),
              "Portugués" to LanguageOption("pt", "vosk-model-small-pt-0.3", TranslateLanguage.PORTUGUESE),
              "Francés" to LanguageOption("fr", "vosk-model-small-fr-0.22", TranslateLanguage.FRENCH),
              "Italiano" to LanguageOption("it", "vosk-model-small-it-0.22", TranslateLanguage.ITALIAN),
              "Japonés" to LanguageOption("ja", "vosk-model-small-ja-0.22", TranslateLanguage.JAPANESE),
              "Ruso" to LanguageOption("ru", "vosk-model-small-ru-0.22", TranslateLanguage.RUSSIAN),
              "Chino" to LanguageOption("zh", "vosk-model-small-cn-0.22", TranslateLanguage.CHINESE)
          )
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/MainActivity.kt <<'__EOF__'
          package com.subtitulos.live

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.material.button.MaterialButton

          class MainActivity : AppCompatActivity() {
              private lateinit var sourceSpinner: Spinner
              private lateinit var targetSpinner: Spinner
              private var pendingStart = false

              private val captureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val data = result.data
                  if (result.resultCode == RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, CaptureService::class.java).apply {
                          putExtra("resultCode", result.resultCode)
                          putExtra("projectionData", data)
                          putExtra("source", sourceSpinner.selectedItem as String)
                          putExtra("target", targetSpinner.selectedItem as String)
                      }
                      ContextCompat.startForegroundService(this, serviceIntent)
                      moveTaskToBack(true)
                  }
              }

              private val overlayLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) {
                  if (Settings.canDrawOverlays(this)) continueStart()
              }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { grants ->
                  if (grants[Manifest.permission.RECORD_AUDIO] == true) continueStart()
              }

              private fun makeSpinner(selected: Int): Spinner {
                  return Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          LANGS.keys.toList()
                      )
                      setSelection(selected.coerceIn(0, LANGS.size - 1))
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 8; bottomMargin = 24 }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("main", MODE_PRIVATE)
                  val savedSource = prefs.getString("source", "Inglés") ?: "Inglés"
                  val savedTarget = prefs.getString("target", "Español") ?: "Español"

                  val sourceIndex = LANGS.keys.indexOf(savedSource).coerceAtLeast(0)
                  val targetIndex = LANGS.keys.indexOf(savedTarget).coerceAtLeast(0)

                  sourceSpinner = makeSpinner(sourceIndex)
                  targetSpinner = makeSpinner(targetIndex)

                  val title = TextView(this).apply {
                      text = getString(R.string.title)
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setPadding(0, 40, 0, 60)
                  }
                  val sourceLabel = TextView(this).apply {
                      text = getString(R.string.label_source)
                      textSize = 14f
                  }
                  val targetLabel = TextView(this).apply {
                      text = getString(R.string.label_target)
                      textSize = 14f
                  }
                  val startButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_start)
                      setOnClickListener { startCapture() }
                  }
                  val stopButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_stop)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 16 }
                  }

                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(60, 60, 60, 60)
                      listOf(
                          title, sourceLabel, sourceSpinner, targetLabel, targetSpinner,
                          startButton, stopButton
                      ).forEach { addView(it) }
                  })
              }

              private fun startCapture() {
                  pendingStart = true
                  continueStart()
              }

              private fun continueStart() {
                  if (!pendingStart) return

                  if (!Settings.canDrawOverlays(this)) {
                      overlayLauncher.launch(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }

                  val audioOk = ContextCompat.checkSelfPermission(
                      this, Manifest.permission.RECORD_AUDIO
                  ) == PackageManager.PERMISSION_GRANTED

                  if (!audioOk) {
                      permissionLauncher.launch(
                          arrayOf(
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.POST_NOTIFICATIONS
                          )
                      )
                      return
                  }

                  pendingStart = false

                  getSharedPreferences("main", MODE_PRIVATE).edit()
                      .putString("source", sourceSpinner.selectedItem as String)
                      .putString("target", targetSpinner.selectedItem as String)
                      .apply()

                  val manager = getSystemService(MediaProjectionManager::class.java)
                  captureLauncher.launch(manager.createScreenCaptureIntent())
              }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/CaptureService.kt <<'__EOF__'
          package com.subtitulos.live

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import com.google.android.material.button.MaterialButton
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import java.io.File
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.zip.ZipInputStream

          class CaptureService : Service(), TextToSpeech.OnInitListener {

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private val mainHandler = Handler(Looper.getMainLooper())
              private val running = AtomicBoolean(false)

              private var audioRecord: AudioRecord? = null
              private var projection: MediaProjection? = null
              private var captureJob: Job? = null

              private var overlay: LinearLayout? = null
              private var subtitleView: TextView? = null
              private var controlsGroup: LinearLayout? = null
              private var toggleButton: MaterialButton? = null
              private var windowParams: WindowManager.LayoutParams? = null
              private var prefs: SharedPreferences? = null

              private var translator: Translator? = null
              private var modelReady = false

              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var ttsLocale: Locale? = null

              private var speechEnabled = true
              private var speechVolume = 100
              private var targetLocale = Locale("es")
              private var lastRecognized = ""
              private var sizeIndex = 2
              private var lastUiUpdate = 0L
              private var currentStatus = ""
              private val sizes = floatArrayOf(14f, 18f, 22f, 28f, 36f, 46f)

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onInit(status: Int) {
                  ttsReady = status == TextToSpeech.SUCCESS
                  if (ttsReady) {
                      tts?.language = ttsLocale ?: targetLocale
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) return START_NOT_STICKY
                  cleanup()
                  running.set(true)

                  val sourceName = intent.getStringExtra("source") ?: "Inglés"
                  val targetName = intent.getStringExtra("target") ?: "Español"
                  val source = LANGS[sourceName] ?: LANGS.values.first()
                  val target = LANGS[targetName] ?: LANGS.values.first()
                  targetLocale = localeFor(target.code)

                  lastRecognized = ""
                  modelReady = false
                  speechEnabled = true
                  speechVolume = 100
                  lastUiUpdate = 0L
                  currentStatus = ""

                  startForegroundNotification()

                  val data = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra("projectionData", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra<Intent>("projectionData")
                  }
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val manager = getSystemService(MediaProjectionManager::class.java)
                  projection = manager.getMediaProjection(intent.getIntExtra("resultCode", 0), data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, mainHandler)

                  ensureTts(targetLocale)
                  createOverlay()

                  if (source.translateCode == target.translateCode) {
                      modelReady = true
                  } else {
                      translator = Translation.getClient(
                          TranslatorOptions.Builder()
                              .setSourceLanguage(source.translateCode)
                              .setTargetLanguage(target.translateCode)
                              .build()
                      )
                      showStatus(getString(R.string.msg_preparing_translation))
                      translator?.downloadModelIfNeeded(DownloadConditions.Builder().build())
                          ?.addOnSuccessListener {
                              modelReady = true
                              showStatus(getString(R.string.msg_listening_plus))
                          }
                          ?.addOnFailureListener {
                              showStatus(getString(R.string.msg_translation_error) + ": " + (it.message ?: ""))
                          }
                  }

                  captureJob = scope.launch { runCaptureLoop(source) }
                  return START_STICKY
              }

              private fun runCaptureLoop(source: LanguageOption) {
                  var recognizer: Recognizer? = null
                  var recorder: AudioRecord? = null
                  try {
                      val model = loadModel(source.code, source.model)
                      if (!running.get()) return
                      recognizer = Recognizer(model, 16000.0f)

                      val config = AudioPlaybackCaptureConfigurationFactory.build(projection!!)
                      val format = AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(16000)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build()
                      val minBuffer = AudioRecord.getMinBufferSize(
                          16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                      )
                      recorder = AudioRecord.Builder()
                          .setAudioPlaybackCaptureConfig(config)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(maxOf(minBuffer * 2, 32768))
                          .build()
                      audioRecord = recorder
                      recorder.startRecording()
                      showStatus(getString(R.string.msg_listening))

                      val buffer = ByteArray(4096)
                      while (running.get() && scope.isActive) {
                          val count = recorder.read(buffer, 0, buffer.size)
                          if (count <= 0) continue
                          val isFinal = recognizer.acceptWaveForm(buffer, count)
                          val json = JSONObject(
                              if (isFinal) recognizer.result else recognizer.partialResult
                          )
                          val key = if (isFinal) "text" else "partial"
                          val recognized = json.optString(key).trim()

                          if (recognized.isNotBlank()) {
                              if (isFinal || recognized != lastRecognized) {
                                  lastRecognized = if (isFinal) "" else recognized
                                  processText(recognized, isFinal)
                              }
                          }
                      }
                  } catch (error: Exception) {
                      if (running.get()) showStatus(
                          getString(R.string.msg_capture_error) + ": " + (error.localizedMessage ?: "?")
                      )
                  } finally {
                      try { recorder?.stop() } catch (_: Exception) {}
                      try { recorder?.release() } catch (_: Exception) {}
                      try { recognizer?.close() } catch (_: Exception) {}
                  }
              }

              private fun processText(text: String, isFinal: Boolean) {
                  val tr = translator
                  if (tr == null || !modelReady) {
                      showSubtitleThrottled(text, isFinal)
                      if (isFinal) speak(text)
                      return
                  }
                  tr.translate(text)
                      .addOnSuccessListener { translated ->
                          if (running.get()) {
                              showSubtitleThrottled("$text\n$translated", isFinal)
                              if (isFinal) speak(translated)
                          }
                      }
                      .addOnFailureListener {
                          showSubtitleThrottled("$text\n(Error de traducción)", true)
                      }
              }

              private fun showSubtitleThrottled(text: String, force: Boolean) {
                  val now = System.currentTimeMillis()
                  if (force || now - lastUiUpdate > 120) {
                      lastUiUpdate = now
                      showSubtitle(text)
                  }
              }

              private fun ensureTts(locale: Locale) {
                  if (tts == null || ttsLocale != locale) {
                      try { tts?.shutdown() } catch (_: Exception) {}
                      ttsLocale = locale
                      ttsReady = false
                      tts = TextToSpeech(this, this)
                  }
              }

              private fun speak(text: String) {
                  if (!speechEnabled || !ttsReady || text.isBlank()) return
                  val params = Bundle().apply {
                      putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, speechVolume / 100f)
                  }
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "sub-${System.currentTimeMillis()}")
              }

              private fun localeFor(code: String): Locale = when (code) {
                  "zh" -> Locale.SIMPLIFIED_CHINESE
                  "pt" -> Locale("pt", "BR")
                  else -> Locale.forLanguageTag(code)
              }

              private fun startForegroundNotification() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(
                          "subtitles_live",
                          getString(R.string.notif_channel),
                          NotificationManager.IMPORTANCE_LOW
                      )
                  )
                  val notification = Notification.Builder(this, "subtitles_live")
                      .setContentTitle(getString(R.string.notif_title))
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notification)
                  }
              }

              private fun createOverlay() {
                  val p = getSharedPreferences("overlay", MODE_PRIVATE)
                  prefs = p
                  sizeIndex = p.getInt("size", 2).coerceIn(0, sizes.lastIndex)
                  val metrics = resources.displayMetrics
                  val wm = getSystemService(WindowManager::class.java)

                  val subtitleTextView = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = sizes[sizeIndex]
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xCC000000.toInt())
                      setPadding(20, 14, 20, 14)
                      text = currentStatus.ifBlank { getString(R.string.msg_preparing) }
                  }

                  val smaller = MaterialButton(this).apply {
                      text = getString(R.string.btn_smaller)
                      setOnClickListener { changeSize(sizeIndex - 1) }
                  }
                  val larger = MaterialButton(this).apply {
                      text = getString(R.string.btn_larger)
                      setOnClickListener { changeSize(sizeIndex + 1) }
                  }
                  val voice = MaterialButton(this).apply {
                      text = getString(R.string.btn_voice_on)
                      setOnClickListener {
                          speechEnabled = !speechEnabled
                          text = getString(
                              if (speechEnabled) R.string.btn_voice_on else R.string.btn_voice_off
                          )
                          if (!speechEnabled) try { tts?.stop() } catch (_: Exception) {}
                      }
                  }
                  val stop = MaterialButton(this).apply {
                      text = getString(R.string.btn_stop)
                      setOnClickListener { stopSelf() }
                  }

                  val volumeLabel = TextView(this).apply {
                      text = getString(R.string.volume_label, 100)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(4, 4, 4, 4)
                  }
                  val volume = SeekBar(this).apply {
                      max = 100
                      progress = 100
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, pr: Int, fromUser: Boolean) {
                              speechVolume = pr
                              volumeLabel.text = getString(R.string.volume_label, pr)
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }

                  val buttonRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xEE171717.toInt())
                      addView(smaller); addView(larger); addView(voice); addView(stop)
                  }

                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(buttonRow)
                      addView(volumeLabel)
                      addView(volume)
                  }

                  val toggle = MaterialButton(this).apply {
                      text = getString(R.string.btn_hide)
                      setOnClickListener {
                          val visible = controls.visibility == View.VISIBLE
                          controls.visibility = if (visible) View.GONE else View.VISIBLE
                          text = getString(if (visible) R.string.btn_show else R.string.btn_hide)
                      }
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xCC000000.toInt())
                      addView(subtitleTextView)
                      addView(toggle)
                      addView(controls)
                  }

                  val params = WindowManager.LayoutParams(
                      (metrics.widthPixels * 0.94f).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = p.getInt("x", (metrics.widthPixels * 0.03f).toInt())
                      y = p.getInt("y", metrics.heightPixels * 2 / 3)
                  }

                  var downX = 0f; var downY = 0f; var startX = 0; var startY = 0
                  subtitleTextView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX; downY = event.rawY
                              startX = params.x; startY = params.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - downX).toInt()
                              params.y = startY + (event.rawY - downY).toInt()
                              try { wm.updateViewLayout(container, params) } catch (_: Exception) {}
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              p.edit().putInt("x", params.x).putInt("y", params.y).apply()
                              true
                          }
                          else -> false
                      }
                  }

                  try { wm.addView(container, params) } catch (_: Exception) {}
                  overlay = container
                  subtitleView = subtitleTextView
                  controlsGroup = controls
                  toggleButton = toggle
                  windowParams = params
              }

              private fun changeSize(newSize: Int) {
                  sizeIndex = newSize.coerceIn(0, sizes.lastIndex)
                  subtitleView?.textSize = sizes[sizeIndex]
                  prefs?.edit()?.putInt("size", sizeIndex)?.apply()
              }

              private fun showSubtitle(text: String) {
                  currentStatus = text
                  mainHandler.post { if (running.get()) subtitleView?.text = text }
              }

              private fun showStatus(text: String) = showSubtitle(text)

              private fun loadModel(languageCode: String, modelName: String): Model {
                  val dir = File(filesDir, "vosk-$languageCode")
                  if (!File(dir, "am").isDirectory) downloadModel(dir, modelName)
                  return try {
                      Model(dir.absolutePath)
                  } catch (_: Exception) {
                      dir.deleteRecursively()
                      downloadModel(dir, modelName)
                      Model(dir.absolutePath)
                  }
              }

              private fun downloadModel(destination: File, modelName: String) {
                  showStatus(getString(R.string.msg_downloading_model))
                  val tempDir = File(filesDir, "tmp-${destination.name}")
                  tempDir.deleteRecursively(); tempDir.mkdirs()
                  val zipFile = File(cacheDir, "${destination.name}.zip")
                  URL("https://alphacephei.com/vosk/models/$modelName.zip").openStream().use { input ->
                      zipFile.outputStream().use { output -> input.copyTo(output) }
                  }
                  ZipInputStream(zipFile.inputStream()).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          val out = File(tempDir, entry.name)
                          if (!out.canonicalPath.startsWith(tempDir.canonicalPath + File.separator)) {
                              throw SecurityException("Archivo de modelo no válido")
                          }
                          if (entry.isDirectory) out.mkdirs()
                          else {
                              out.parentFile?.mkdirs()
                              out.outputStream().use { zip.copyTo(it) }
                          }
                          zip.closeEntry()
                          entry = zip.nextEntry
                      }
                  }
                  zipFile.delete()
                  val modelRoot = tempDir.walkTopDown()
                      .firstOrNull { File(it, "am").isDirectory }
                      ?: throw IllegalStateException("Modelo incompleto")
                  destination.deleteRecursively()
                  if (!modelRoot.renameTo(destination)) {
                      modelRoot.copyRecursively(destination, overwrite = true)
                  }
                  tempDir.deleteRecursively()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  overlay?.let { view ->
                      try {
                          val metrics = resources.displayMetrics
                          windowParams?.let { p ->
                              p.width = (metrics.widthPixels * 0.94f).toInt()
                              getSystemService(WindowManager::class.java).updateViewLayout(view, p)
                          }
                      } catch (_: Exception) {}
                  }
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  stopSelf()
                  super.onTaskRemoved(rootIntent)
              }

              private fun cleanup() {
                  running.set(false)
                  captureJob?.cancel()
                  captureJob = null
                  try { audioRecord?.stop() } catch (_: Exception) {}
                  try { audioRecord?.release() } catch (_: Exception) {}
                  audioRecord = null
                  try { projection?.stop() } catch (_: Exception) {}
                  projection = null
                  try { translator?.close() } catch (_: Exception) {}
                  translator = null
                  try { tts?.stop() } catch (_: Exception) {}
                  try { tts?.shutdown() } catch (_: Exception) {}
                  tts = null
                  ttsReady = false
                  ttsLocale = null
                  try {
                      overlay?.let { getSystemService(WindowManager::class.java).removeView(it) }
                  } catch (_: Exception) {}
                  overlay = null
                  subtitleView = null
                  controlsGroup = null
                  toggleButton = null
                  windowParams = null
              }

              override fun onDestroy() {
                  cleanup()
                  scope.cancel()
                  super.onDestroy()
              }

              private object AudioPlaybackCaptureConfigurationFactory {
                  fun build(projection: MediaProjection) =
                      android.media.AudioPlaybackCaptureConfiguration.Builder(projection)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .build()
              }
          }
          __EOF__

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (release con R8)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "2.2.${{ github.run_number }}"
        run: |
          gradle assembleRelease --stacktrace

      - name: Verificar firma
        run: |
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk || true

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosLive-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
