name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle.kts <<'__EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SubtitulosLive"
          include(":app")
          __EOF__

          cat > build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF__

          cat > gradle.properties <<'__EOF__'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.nonTransitiveRClass=true
          __EOF__

          mkdir -p app/src/main/java/com/subtitulos/live
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Subtítulos Live</string>
          </resources>
          __EOF__

          cat > app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.subtitulos.live"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.subtitulos.live"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.google.mlkit:translate:17.0.3")
          }
          __EOF__

          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/Languages.kt <<'__EOF__'
          package com.subtitulos.live

          import com.google.mlkit.nl.translate.TranslateLanguage

          data class LanguageOption(
              val code: String,
              val model: String,
              val translateCode: String
          )

          val LANGS = linkedMapOf(
              "Español" to LanguageOption("es", "vosk-model-small-es-0.42", TranslateLanguage.SPANISH),
              "Inglés" to LanguageOption("en", "vosk-model-small-en-us-0.15", TranslateLanguage.ENGLISH),
              "Alemán" to LanguageOption("de", "vosk-model-small-de-0.15", TranslateLanguage.GERMAN),
              "Coreano" to LanguageOption("ko", "vosk-model-small-ko-0.22", TranslateLanguage.KOREAN),
              "Portugués" to LanguageOption("pt", "vosk-model-small-pt-0.3", TranslateLanguage.PORTUGUESE),
              "Francés" to LanguageOption("fr", "vosk-model-small-fr-0.22", TranslateLanguage.FRENCH),
              "Italiano" to LanguageOption("it", "vosk-model-small-it-0.22", TranslateLanguage.ITALIAN),
              "Japonés" to LanguageOption("ja", "vosk-model-small-ja-0.22", TranslateLanguage.JAPANESE),
              "Ruso" to LanguageOption("ru", "vosk-model-small-ru-0.22", TranslateLanguage.RUSSIAN),
              "Chino" to LanguageOption("zh", "vosk-model-small-cn-0.22", TranslateLanguage.CHINESE)
          )
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/MainActivity.kt <<'__EOF__'
          package com.subtitulos.live

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var sourceSpinner: Spinner
              private lateinit var targetSpinner: Spinner

              private fun makeSpinner(selected: Int): Spinner {
                  return Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          LANGS.keys.toList()
                      )
                      setSelection(selected)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  sourceSpinner = makeSpinner(1)
                  targetSpinner = makeSpinner(0)

                  val title = TextView(this).apply {
                      text = "SUBTÍTULOS LIVE"
                      textSize = 24f
                      gravity = Gravity.CENTER
                      setTextColor(0xFFFFFFFF.toInt())
                  }
                  val sourceLabel = TextView(this).apply {
                      text = "Idioma del audio"
                      setTextColor(0xFFFFFFFF.toInt())
                  }
                  val targetLabel = TextView(this).apply {
                      text = "Traducir al idioma"
                      setTextColor(0xFFFFFFFF.toInt())
                  }
                  val startButton = Button(this).apply {
                      text = "Iniciar subtítulos"
                      setOnClickListener { startCapture() }
                  }
                  val stopButton = Button(this).apply {
                      text = "Detener"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                  }

                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(40, 40, 40, 40)
                      setBackgroundColor(0xFF000000.toInt())
                      listOf(title, sourceLabel, sourceSpinner, targetLabel, targetSpinner,
                          startButton, stopButton).forEach { addView(it) }
                  })
              }

              private fun startCapture() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS),
                          10
                      )
                      return
                  }

                  val manager = getSystemService(MediaProjectionManager::class.java)
                  startActivityForResult(manager.createScreenCaptureIntent(), 20)
              }

              @Deprecated("Usado para compatibilidad con el flujo de MediaProjection")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 20 && resultCode == RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, CaptureService::class.java).apply {
                          putExtra("resultCode", resultCode)
                          putExtra("projectionData", data)
                          putExtra("source", sourceSpinner.selectedItem as String)
                          putExtra("target", targetSpinner.selectedItem as String)
                      }
                      startForegroundService(serviceIntent)
                      moveTaskToBack(true)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 10 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCapture()
                  }
              }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/CaptureService.kt <<'__EOF__'
          package com.subtitulos.live

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import java.io.File
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.zip.ZipInputStream
          import kotlin.concurrent.thread

          class CaptureService : Service(), TextToSpeech.OnInitListener {
              private var running = AtomicBoolean(false)
              private var audioRecord: AudioRecord? = null
              private var projection: MediaProjection? = null
              private var overlay: LinearLayout? = null
              private var subtitleView: TextView? = null
              private var translator: Translator? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var speechEnabled = true
              private var speechVolume = 100
              private var targetLocale = Locale("es")
              private var lastRecognized = ""
              private var modelReady = false
              private var sizeIndex = 2
              private val sizes = floatArrayOf(14f, 18f, 22f, 28f, 36f, 46f)
              private val mainHandler = Handler(Looper.getMainLooper())
              private var windowParams: WindowManager.LayoutParams? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onInit(status: Int) {
                  ttsReady = status == TextToSpeech.SUCCESS
                  if (ttsReady) {
                      tts?.language = targetLocale
                      tts?.setSpeechRate(1.0f)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) return START_NOT_STICKY
                  stopCapture()

                  val sourceName = intent.getStringExtra("source") ?: "Inglés"
                  val targetName = intent.getStringExtra("target") ?: "Español"
                  val source = LANGS[sourceName] ?: LANGS.values.first()
                  val target = LANGS[targetName] ?: LANGS.values.first()
                  targetLocale = localeFor(target.code)
                  lastRecognized = ""
                  modelReady = false
                  speechEnabled = true
                  speechVolume = 100

                  val notificationManager = getSystemService(NotificationManager::class.java)
                  notificationManager.createNotificationChannel(
                      NotificationChannel("subtitles_live", "Subtítulos Live", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notification = Notification.Builder(this, "subtitles_live")
                      .setContentTitle("Subtítulos Live está activo")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notification)
                  }

                  val data = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra("projectionData", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra<Intent>("projectionData")
                  } ?: run {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val manager = getSystemService(MediaProjectionManager::class.java)
                  projection = manager.getMediaProjection(intent.getIntExtra("resultCode", 0), data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, mainHandler)

                  running.set(true)
                  tts?.shutdown()
                  tts = TextToSpeech(this, this)
                  createOverlay()

                  if (source.translateCode == target.translateCode) {
                      modelReady = true
                  } else {
                      translator = Translation.getClient(
                          TranslatorOptions.Builder()
                              .setSourceLanguage(source.translateCode)
                              .setTargetLanguage(target.translateCode)
                              .build()
                      )
                      showMessage("Preparando traducción…")
                      translator?.downloadModelIfNeeded(DownloadConditions.Builder().build())
                          ?.addOnSuccessListener { modelReady = true; showMessage("Escuchando audio…") }
                          ?.addOnFailureListener { showMessage("No se pudo descargar el idioma: ${it.message}") }
                  }

                  thread(name = "audio-capture") {
                      try {
                          val model = loadModel(source.code, source.model)
                          if (!running.get()) return@thread
                          val recognizer = Recognizer(model, 16000.0f)
                          val config = android.media.AudioPlaybackCaptureConfiguration.Builder(projection!!)
                              .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                              .addMatchingUsage(AudioAttributes.USAGE_GAME)
                              .build()
                          val format = AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(16000)
                              .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                              .build()
                          val minBuffer = AudioRecord.getMinBufferSize(
                              16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                          )
                          val recorder = AudioRecord.Builder()
                              .setAudioPlaybackCaptureConfig(config)
                              .setAudioFormat(format)
                              .setBufferSizeInBytes(maxOf(minBuffer, 32000))
                              .build()
                          if (!running.get()) {
                              recorder.release()
                              recognizer.close()
                              return@thread
                          }
                          audioRecord = recorder
                          recorder.startRecording()
                          showMessage("Escuchando audio interno…")
                          val buffer = ByteArray(4096)
                          while (running.get()) {
                              val count = recorder.read(buffer, 0, buffer.size)
                              if (count <= 0) continue
                              val finalResult = recognizer.acceptWaveForm(buffer, count)
                              val json = JSONObject(if (finalResult) recognizer.result else recognizer.partialResult)
                              val key = if (finalResult) "text" else "partial"
                              val recognized = json.optString(key).trim()
                              if (recognized.isNotBlank() && recognized != lastRecognized) {
                                  lastRecognized = recognized
                                  processText(recognized, finalResult)
                              }
                          }
                          recognizer.close()
                      } catch (error: Exception) {
                          if (running.get()) showMessage("Error de captura: ${error.localizedMessage ?: "desconocido"}")
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun processText(text: String, finalResult: Boolean) {
                  mainHandler.post {
                      if (!running.get()) return@post
                      if (translator == null) {
                          showSubtitle(text)
                          if (finalResult) speak(text)
                      } else if (modelReady) {
                          translator?.translate(text)
                              ?.addOnSuccessListener { translated ->
                                  if (running.get()) {
                                      showSubtitle("$text\n$translated")
                                      if (finalResult) speak(translated)
                                  }
                              }
                              ?.addOnFailureListener {
                                  showSubtitle("$text\n(Error de traducción)")
                              }
                      }
                  }
              }

              private fun speak(text: String) {
                  if (!speechEnabled || !ttsReady || text.isBlank()) return
                  val params = android.os.Bundle().apply {
                      putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, speechVolume / 100f)
                  }
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "subtitle-${System.currentTimeMillis()}")
              }

              private fun localeFor(code: String): Locale = when (code) {
                  "zh" -> Locale.SIMPLIFIED_CHINESE
                  "pt" -> Locale("pt", "BR")
                  else -> Locale.forLanguageTag(code)
              }

              private fun createOverlay() {
                  val prefs = getSharedPreferences("overlay", MODE_PRIVATE)
                  sizeIndex = prefs.getInt("size", 2).coerceIn(0, sizes.lastIndex)
                  val metrics = resources.displayMetrics
                  val windowManager = getSystemService(WindowManager::class.java)

                  val subtitleTextView = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = sizes[sizeIndex]
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xCC000000.toInt())
                      setPadding(20, 14, 20, 14)
                      this.text = "Preparando subtítulos…"
                  }

                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xEE171717.toInt())
                  }

                  val smaller = Button(this).apply {
                      text = "A−"
                      setOnClickListener { changeSize(sizeIndex - 1) }
                  }
                  val larger = Button(this).apply {
                      text = "A+"
                      setOnClickListener { changeSize(sizeIndex + 1) }
                  }
                  val voice = Button(this).apply {
                      text = "Voz: Sí"
                      setOnClickListener {
                          speechEnabled = !speechEnabled
                          this.text = if (speechEnabled) "Voz: Sí" else "Voz: No"
                          if (!speechEnabled) tts?.stop()
                      }
                  }
                  val stop = Button(this).apply {
                      text = "Detener"
                      setOnClickListener { stopSelf() }
                  }
                  controls.addView(smaller)
                  controls.addView(larger)
                  controls.addView(voice)
                  controls.addView(stop)

                  val volumeLabel = TextView(this).apply {
                      text = "Volumen de voz: 100%"
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(4, 4, 4, 4)
                  }
                  val volume = SeekBar(this).apply {
                      max = 100
                      progress = 100
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              speechVolume = progress
                              volumeLabel.text = "Volumen de voz: $progress%"
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xCC000000.toInt())
                      addView(subtitleTextView)
                      addView(controls)
                      addView(volumeLabel)
                      addView(volume)
                  }

                  val params = WindowManager.LayoutParams(
                      (metrics.widthPixels * 0.94f).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt("x", (metrics.widthPixels * 0.03f).toInt())
                      y = prefs.getInt("y", metrics.heightPixels * 2 / 3)
                  }

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  subtitleTextView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX
                              downY = event.rawY
                              startX = params.x
                              startY = params.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - downX).toInt()
                              params.y = startY + (event.rawY - downY).toInt()
                              try { windowManager.updateViewLayout(container, params) } catch (_: Exception) {}
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              prefs.edit().putInt("x", params.x).putInt("y", params.y).apply()
                              true
                          }
                          else -> false
                      }
                  }

                  windowManager.addView(container, params)
                  overlay = container
                  subtitleView = subtitleTextView
                  windowParams = params
              }

              private fun changeSize(newSize: Int) {
                  sizeIndex = newSize.coerceIn(0, sizes.lastIndex)
                  subtitleView?.textSize = sizes[sizeIndex]
                  getSharedPreferences("overlay", MODE_PRIVATE).edit().putInt("size", sizeIndex).apply()
              }

              private fun showSubtitle(text: String) {
                  mainHandler.post { if (running.get()) subtitleView?.text = text }
              }

              private fun showMessage(text: String) = showSubtitle(text)

              private fun loadModel(languageCode: String, modelName: String): Model {
                  val modelDir = File(filesDir, "vosk-$languageCode")
                  if (!File(modelDir, "am").isDirectory) downloadModel(modelDir, modelName)
                  return try {
                      Model(modelDir.absolutePath)
                  } catch (error: Exception) {
                      modelDir.deleteRecursively()
                      downloadModel(modelDir, modelName)
                      Model(modelDir.absolutePath)
                  }
              }

              private fun downloadModel(destination: File, modelName: String) {
                  showMessage("Descargando modelo de reconocimiento…")
                  val tempDir = File(filesDir, "tmp-${destination.name}")
                  tempDir.deleteRecursively()
                  tempDir.mkdirs()
                  val zipFile = File(cacheDir, "${destination.name}.zip")
                  URL("https://alphacephei.com/vosk/models/$modelName.zip").openStream().use { input ->
                      zipFile.outputStream().use { output -> input.copyTo(output) }
                  }
                  ZipInputStream(zipFile.inputStream()).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          val out = File(tempDir, entry.name)
                          if (!out.canonicalPath.startsWith(tempDir.canonicalPath + File.separator)) {
                              throw SecurityException("Archivo de modelo no válido")
                          }
                          if (entry.isDirectory) out.mkdirs()
                          else {
                              out.parentFile?.mkdirs()
                              out.outputStream().use { zip.copyTo(it) }
                          }
                          zip.closeEntry()
                          entry = zip.nextEntry
                      }
                  }
                  zipFile.delete()
                  val modelRoot = tempDir.walkTopDown().firstOrNull { File(it, "am").isDirectory }
                      ?: throw IllegalStateException("El modelo descargado está incompleto")
                  destination.deleteRecursively()
                  if (!modelRoot.renameTo(destination)) {
                      modelRoot.copyRecursively(destination, overwrite = true)
                  }
                  tempDir.deleteRecursively()
              }

              private fun stopCapture() {
                  running.set(false)
                  try { audioRecord?.stop() } catch (_: Exception) {}
                  try { audioRecord?.release() } catch (_: Exception) {}
                  audioRecord = null
                  try { projection?.stop() } catch (_: Exception) {}
                  projection = null
                  try { translator?.close() } catch (_: Exception) {}
                  translator = null
                  try { tts?.stop() } catch (_: Exception) {}
                  try { tts?.shutdown() } catch (_: Exception) {}
                  tts = null
                  ttsReady = false
                  try {
                      overlay?.let { getSystemService(WindowManager::class.java).removeView(it) }
                  } catch (_: Exception) {}
                  overlay = null
                  subtitleView = null
                  windowParams = null
              }

              override fun onDestroy() {
                  stopCapture()
                  super.onDestroy()
              }
          }
          __EOF__

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosLive-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
