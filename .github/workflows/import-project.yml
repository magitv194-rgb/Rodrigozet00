              "Coreano" to LanguageOption("ko", "vosk-model-small-ko-0.22", "vosk-model-ko-0.22", TranslateLanguage.KOREAN, Locale.KOREA),
              "Portugués" to LanguageOption("pt", "vosk-model-small-pt-0.3", "vosk-model-pt-fb-v0.1.1-20220516_2113", TranslateLanguage.PORTUGUESE, Locale("pt", "BR")),
              "Francés" to LanguageOption("fr", "vosk-model-small-fr-0.22", "vosk-model-fr-0.22", TranslateLanguage.FRENCH, Locale.FRANCE),
              "Italiano" to LanguageOption("it", "vosk-model-small-it-0.22", "vosk-model-it-0.22", TranslateLanguage.ITALIAN, Locale.ITALY),
              "Japonés" to LanguageOption("ja", "vosk-model-small-ja-0.22", "vosk-model-ja-0.22", TranslateLanguage.JAPANESE, Locale.JAPAN),
              "Ruso" to LanguageOption("ru", "vosk-model-small-ru-0.22", "vosk-model-ru-0.42", TranslateLanguage.RUSSIAN, Locale("ru")),
