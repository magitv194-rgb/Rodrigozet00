name: Probar captura de audio interno

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/subtituloslive/test
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SubtitulosLiveTest"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.subtituloslive.test'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.subtituloslive.test'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Subtítulos Live - Prueba"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/subtituloslive/test/MainActivity.java <<'EOF'
          package com.subtituloslive.test;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final int REQUEST_CAPTURE = 1001;
              private TextView status;
              private TextView meter;
              private Button startButton;
              private boolean receiverRegistered = false;

              private final BroadcastReceiver receiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (CaptureService.ACTION_STATUS.equals(intent.getAction())) {
                          String message = intent.getStringExtra("message");
                          int level = intent.getIntExtra("level", 0);

                          if (message != null) {
                              status.setText(message);
                          }

                          meter.setText("Nivel de audio interno: " + level + "%");
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(28, 30, 28, 30);
                  layout.setBackgroundColor(0xFF000000);

                  TextView title = new TextView(this);
                  title.setText("SUBTÍTULOS LIVE");
                  title.setTextColor(0xFFFFFFFF);
                  title.setTextSize(25);
                  title.setGravity(Gravity.CENTER);

                  TextView description = new TextView(this);
                  description.setText(
                      "PRUEBA DE AUDIO INTERNO\n\n" +
                      "Esta prueba intenta recibir el sonido de otras aplicaciones.\n" +
                      "El micrófono del celular NO se utiliza."
                  );
                  description.setTextColor(0xFFCCCCCC);
                  description.setTextSize(16);
                  description.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("Estado: esperando autorización");
                  status.setTextColor(0xFFFFFFFF);
                  status.setTextSize(17);
                  status.setGravity(Gravity.CENTER);

                  meter = new TextView(this);
                  meter.setText("Nivel de audio interno: --");
                  meter.setTextColor(0xFF00FF88);
                  meter.setTextSize(19);
                  meter.setGravity(Gravity.CENTER);

                  startButton = new Button(this);
                  startButton.setText("PROBAR AUDIO INTERNO");
                  startButton.setOnClickListener(v -> requestCapture());

                  Button stopButton = new Button(this);
                  stopButton.setText("DETENER PRUEBA");
                  stopButton.setOnClickListener(v -> {
                      Intent stop = new Intent(this, CaptureService.class);
                      stop.setAction(CaptureService.ACTION_STOP);
                      startService(stop);
                      status.setText("Prueba detenida");
                      meter.setText("Nivel de audio interno: --");
                  });

                  layout.addView(title);
                  layout.addView(description);
                  layout.addView(status);
                  layout.addView(meter);
                  layout.addView(startButton);
                  layout.addView(stopButton);

                  setContentView(layout);

                  IntentFilter filter = new IntentFilter(CaptureService.ACTION_STATUS);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(receiver, filter);
                  }
                  receiverRegistered = true;
              }

              private void requestCapture() {
                  MediaProjectionManager manager =
                      (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);

                  status.setText("Esperando autorización de Android...");

                  Intent captureIntent = manager.createScreenCaptureIntent();
                  startActivityForResult(captureIntent, REQUEST_CAPTURE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == REQUEST_CAPTURE) {
                      if (resultCode == RESULT_OK && data != null) {
                          Intent service = new Intent(this, CaptureService.class);
                          service.putExtra("resultCode", resultCode);
                          service.putExtra("projectionData", data);

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(service);
                          } else {
                              startService(service);
                          }

                          status.setText("Autorizado. Iniciando captura...");
                      } else {
                          status.setText("Autorización cancelada");
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  if (receiverRegistered) {
                      unregisterReceiver(receiver);
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/subtituloslive/test/CaptureService.java <<'EOF'
          package com.subtituloslive.test;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.media.AudioPlaybackCaptureConfiguration;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.Process;

          public class CaptureService extends Service {

              public static final String ACTION_STATUS =
                  "com.subtituloslive.test.CAPTURE_STATUS";
              public static final String ACTION_STOP = "STOP_CAPTURE";

              private static final String CHANNEL_ID = "internal_audio_test";
              private MediaProjection projection;
              private AudioRecord recorder;
              private Thread captureThread;
              private volatile boolean running = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopCapture();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  startForeground(1, createNotification());

                  if (intent == null) {
                      sendStatus("No se recibió autorización", 0);
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  int resultCode = intent.getIntExtra("resultCode", 0);
                  Intent data;

                  if (Build.VERSION.SDK_INT >= 33) {
                      data = intent.getParcelableExtra("projectionData", Intent.class);
                  } else {
                      data = intent.getParcelableExtra("projectionData");
                  }

                  if (data == null) {
                      sendStatus("No se recibió el permiso de captura", 0);
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  try {
                      MediaProjectionManager manager =
                          (MediaProjectionManager) getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE);

                      projection = manager.getMediaProjection(resultCode, data);

                      if (projection == null) {
                          sendStatus("Android no permitió crear la captura", 0);
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      projection.registerCallback(
                          new MediaProjection.Callback() {
                              @Override
                              public void onStop() {
                                  stopCapture();
                                  stopSelf();
                              }
                          },
                          null
                      );

                      startAudioCapture();

                  } catch (SecurityException | IllegalStateException e) {
                      sendStatus("Captura bloqueada: " + e.getMessage(), 0);
                      stopSelf();
                  }

                  return START_NOT_STICKY;
              }

              private void startAudioCapture() {
                  int sampleRate = 16000;
                  int bufferSize = AudioRecord.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  );

                  if (bufferSize <= 0) {
                      sendStatus("No se pudo preparar el formato de audio", 0);
                      stopSelf();
                      return;
                  }

                  AudioPlaybackCaptureConfiguration config =
                      new AudioPlaybackCaptureConfiguration.Builder(projection)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .build();

                  AudioFormat format = new AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(sampleRate)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build();

                  recorder = new AudioRecord.Builder()
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(bufferSize * 2)
                      .setAudioPlaybackCaptureConfig(config)
                      .build();

                  if (recorder.getState() != AudioRecord.STATE_INITIALIZED) {
                      sendStatus("No se pudo iniciar AudioRecord", 0);
                      stopSelf();
                      return;
                  }

                  recorder.startRecording();
                  running = true;

                  sendStatus("Captura interna iniciada. Reproduce un LIVE.", 0);

                  captureThread = new Thread(() -> {
                      Process.setThreadPriority(Process.THREAD_PRIORITY_AUDIO);

                      short[] samples = new short[bufferSize / 2];

                      while (running && recorder != null) {
                          int count = recorder.read(
                              samples, 0, samples.length,
                              AudioRecord.READ_BLOCKING
                          );

                          if (count > 0) {
                              double sum = 0;

                              for (int i = 0; i < count; i++) {
                                  double value = samples[i] / 32768.0;
                                  sum += value * value;
                              }

                              double rms = Math.sqrt(sum / count);
                              int level = (int) Math.min(100, rms * 400);

                              sendStatus(
                                  level > 0
                                      ? "Captura activa: se reciben muestras de audio"
                                      : "Captura activa: esperando sonido",
                                  level
                              );
                          } else if (count < 0) {
                              sendStatus("Error leyendo audio: " + count, 0);
                              break;
                          }
                      }
                  }, "InternalAudioCapture");

                  captureThread.start();
              }

              private void sendStatus(String message, int level) {
                  Intent update = new Intent(ACTION_STATUS);
                  update.setPackage(getPackageName());
                  update.putExtra("message", message);
                  update.putExtra("level", level);
                  sendBroadcast(update);
              }

              private Notification createNotification() {
                  Intent openApp = new Intent(this, MainActivity.class);

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openApp,
                      PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  return builder
                      .setContentTitle("Subtítulos Live")
                      .setContentText("Prueba de captura de audio interno")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Captura de audio interno",
                          NotificationManager.IMPORTANCE_LOW
                      );

                      NotificationManager manager =
                          getSystemService(NotificationManager.class);

                      manager.createNotificationChannel(channel);
                  }
              }

              private void stopCapture() {
                  running = false;

                  if (recorder != null) {
                      try {
                          recorder.stop();
                      } catch (Exception ignored) {
                      }

                      recorder.release();
                      recorder = null;
                  }

                  if (projection != null) {
                      projection.stop();
                      projection = null;
                  }

                  sendStatus("Captura detenida", 0);
              }

              @Override
              public void onDestroy() {
                  stopCapture();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosLive-Prueba-Audio-Interno
          path: app/build/outputs/apk/debug/app-debug.apk
