              private fun createInternalRecord(): AudioRecord {
                  val b = android.media.AudioPlaybackCaptureConfiguration.Builder(projection!!)
                  when (settings.audioFilter) {
                      "all" -> {
                          b.addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          b.addMatchingUsage(AudioAttributes.USAGE_GAME)
                          b.addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      }
                      "media" -> b.addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      else -> {
                          b.addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          b.addMatchingUsage(AudioAttributes.USAGE_GAME)
                      }
                  }
                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(16000)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                  val minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  return AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(b.build())
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(maxOf(minBuf * 2, 32768)).build()
              }

              private fun createMicRecord(): AudioRecord {
                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(16000)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                  val minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  return AudioRecord.Builder()
                      .setAudioSource(MediaRecorder.AudioSource.MIC)
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(maxOf(minBuf * 2, 32768)).build()
              }

              private fun runCaptureLoop(source: LanguageOption) {
                  var recognizer: Recognizer? = null
                  try {
                      val model = loadModel(source)
                      if (!running.get()) return
                      recognizer = Recognizer(model, 16000.0f)

                      val mode = settings.audioFilter
                      val useInternal = mode != "mic"
                      val useMic = mode == "mic" || mode == "mic_internal"

                      if (useInternal) {
                          try {
                              internalAudioRecord = createInternalRecord()
                          } catch (e: Exception) {
                              if (e.message?.contains("could not register audio policy") == true) {
                                  showSubtitle(getString(R.string.msg_capture_retry))
                                  Thread.sleep(500)
                                  internalAudioRecord = createInternalRecord()
                              } else throw e
                          }
                      }

                      if (useMic) {
                          micAudioRecord = createMicRecord()
                          if (AcousticEchoCanceler.isAvailable()) {
                              aec = AcousticEchoCanceler.create(micAudioRecord!!.audioSessionId)
                              aec?.enabled = true
                          }
                      }

                      internalAudioRecord?.startRecording()
                      micAudioRecord?.startRecording()

                      val bufferSize = 4096
                      val internalBuffer = ByteArray(bufferSize)
                      val micBuffer = ByteArray(bufferSize)
                      val mixedBuffer = ByteArray(bufferSize)

                      while (running.get() && scope.isActive) {
                          var bytesRead = 0
                          if (useInternal && useMic) {
                              val intRead = internalAudioRecord?.read(internalBuffer, 0, bufferSize) ?: 0
                              val micRead = micAudioRecord?.read(micBuffer, 0, bufferSize) ?: 0
                              bytesRead = minOf(intRead, micRead)
                              if (bytesRead > 0) {
                                  for (i in 0 until bytesRead step 2) {
                                      val s1 = ((internalBuffer[i].toInt() and 0xFF) or (internalBuffer[i + 1].toInt() shl 8)).toShort()
                                      val s2 = ((micBuffer[i].toInt() and 0xFF) or (micBuffer[i + 1].toInt() shl 8)).toShort()
                                      val mixed = ((s1 + s2) / 2).toShort()
                                      mixedBuffer[i] = (mixed.toInt() and 0xFF).toByte()
                                      mixedBuffer[i + 1] = ((mixed.toInt() shr 8) and 0xFF).toByte()
                                  }
                              }
                          } else if (useInternal) {
                              bytesRead = internalAudioRecord?.read(mixedBuffer, 0, bufferSize) ?: 0
                          } else if (useMic) {
                              bytesRead = micAudioRecord?.read(mixedBuffer, 0, bufferSize) ?: 0
                          }

                          if (bytesRead <= 0) continue

                          var maxAmplitude = 0
                          for (i in 0 until bytesRead) {
                              val abs = abs(mixedBuffer[i].toInt())
                              if (abs > maxAmplitude) maxAmplitude = abs
                          }
                          if (System.currentTimeMillis() - lastUiUpdate > 500) {
                              lastUiUpdate = System.currentTimeMillis()
                              mainHandler.post {
                                  if (subtitleView?.text?.contains("Nivel") == true || subtitleView?.text?.contains("Escuchando") == true) {
                                      subtitleView?.text = "Escuchando audio… (Nivel: $maxAmplitude)"
                                  }
                              }
