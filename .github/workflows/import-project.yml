          cat > app/src/main/java/com/subtitulos/live/DeepLClient.kt <<'__EOF__'
          package com.subtitulos.live

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException

          class DeepLClient(private val apiKey: String) {
              private val client = OkHttpClient()

              suspend fun translate(text: String, sourceCode: String, targetCode: String): String =
                  withContext(Dispatchers.IO) {
                      val url = "https://api-free.deepl.com/v2/translate"
                      val body = FormBody.Builder()
                          .add("text", text)
                          .add("source_lang", deeplSource(sourceCode))
                          .add("target_lang", deeplTarget(targetCode))
                          .build()
                      val req = Request.Builder()
                          .url(url)
                          .addHeader("Authorization", "DeepL-Auth-Key $apiKey")
                          .post(body)
                          .build()
                      client.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) throw IOException("DeepL ${resp.code}")
                          val json = JSONObject(resp.body!!.string())
                          json.getJSONArray("translations").getJSONObject(0).getString("text")
                      }
                  }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/SrtExporter.kt <<'__EOF__'
          package com.subtitulos.live

          import android.content.ContentValues
          import android.content.Context
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class SubtitleEntry(val startMs: Long, val endMs: Long, val original: String, val translated: String?)

          object SrtExporter {
              fun save(context: Context, entries: List<SubtitleEntry>): String {
                  val filename = "subtitulos-${SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())}.srt"
                  val content = buildString {
                      entries.forEachIndexed { i, e ->
                          append("${i + 1}\n")
                          append("${fmt(e.startMs)} --> ${fmt(e.endMs)}\n")
                          if (e.translated.isNullOrBlank()) append("${e.original}\n")
                          else append("${e.original}\n${e.translated}\n")
                          append("\n")
                      }
                  }
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, filename)
                      put(MediaStore.Downloads.MIME_TYPE, "application/x-subrip")
                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                  }
                  val uri = context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: throw IOException("No se pudo crear el archivo")
                  context.contentResolver.openOutputStream(uri)!!.use { it.write(content.toByteArray()) }
                  return "Descargas/$filename"
              }

              private fun fmt(ms: Long): String {
                  val h = ms / 3_600_000; val m = (ms % 3_600_000) / 60_000
                  val s = (ms % 60_000) / 1_000; val milli = ms % 1_000
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, milli)
              }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/MainActivity.kt <<'__EOF__'
          package com.subtitulos.live

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate
          import androidx.core.content.ContextCompat
          import com.google.android.material.button.MaterialButton

          class MainActivity : AppCompatActivity() {
              private lateinit var settings: AppSettings
              private lateinit var sourceSpinner: Spinner
              private lateinit var targetSpinner: Spinner
              private var pendingStart = false

              private val captureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val data = result.data
                  if (result.resultCode == RESULT_OK && data != null) {
                      ContextCompat.startForegroundService(
                          this,
                          Intent(this, CaptureService::class.java).apply {
                              putExtra("resultCode", result.resultCode)
                              putExtra("projectionData", data)
                          }
                      )
                      moveTaskToBack(true)
                  }
              }

              private val overlayLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { if (Settings.canDrawOverlays(this)) continueStart() }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { grants -> if (grants[Manifest.permission.RECORD_AUDIO] == true) continueStart() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  settings = AppSettings(this)
                  applyTheme()
                  super.onCreate(savedInstanceState)

                  sourceSpinner = makeSpinner(LANGS.keys.indexOf(settings.sourceLang).coerceAtLeast(0))
                  targetSpinner = makeSpinner(LANGS.keys.indexOf(settings.targetLang).coerceAtLeast(0))

                  val title = TextView(this).apply {
                      text = getString(R.string.title); textSize = 26f
                      gravity = Gravity.CENTER; setPadding(0, 40, 0, 60)
                  }
                  val sourceLabel = TextView(this).apply { text = getString(R.string.label_source); textSize = 14f }
                  val targetLabel = TextView(this).apply { text = getString(R.string.label_target); textSize = 14f }
                  val startButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_start)
                      setOnClickListener { startCapture() }
                  }
                  val settingsButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_settings)
                      setOnClickListener {
                          startActivity(Intent(this@MainActivity, SettingsActivity::class.java))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 16 }
                  }
                  val stopButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_stop)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 8 }
                  }

                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(60, 60, 60, 60)
                      listOf(title, sourceLabel, sourceSpinner, targetLabel, targetSpinner,
                          startButton, settingsButton, stopButton).forEach { addView(it) }
                  })
              }

              private fun applyTheme() {
                  val mode = when (settings.themeMode) {
                      "light" -> AppCompatDelegate.MODE_NIGHT_NO
                      "dark" -> AppCompatDelegate.MODE_NIGHT_YES
                      else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                  }
                  AppCompatDelegate.setDefaultNightMode(mode)
              }

              private fun makeSpinner(selected: Int): Spinner = Spinner(this).apply {
                  adapter = ArrayAdapter(this@MainActivity,
                      android.R.layout.simple_spinner_dropdown_item, LANGS.keys.toList())
                  setSelection(selected.coerceIn(0, LANGS.size - 1))
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = 8; bottomMargin = 24 }
              }

              private fun startCapture() { pendingStart = true; continueStart() }

              private fun continueStart() {
                  if (!pendingStart) return
                  if (!Settings.canDrawOverlays(this)) {
                      overlayLauncher.launch(Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")))
                      return
                  }
                  val audioOk = ContextCompat.checkSelfPermission(
                      this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  if (!audioOk) {
                      permissionLauncher.launch(arrayOf(
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.POST_NOTIFICATIONS))
                      return
                  }
                  pendingStart = false
                  settings.sourceLang = sourceSpinner.selectedItem as String
                  settings.targetLang = targetSpinner.selectedItem as String
                  captureLauncher.launch(
                      getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent())
              }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/SettingsActivity.kt <<'__EOF__'
          package com.subtitulos.live

          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate
          import com.google.android.material.button.MaterialButton

          class SettingsActivity : AppCompatActivity() {
              private lateinit var settings: AppSettings
              private lateinit var root: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  settings = AppSettings(this)
                  applyTheme()
                  super.onCreate(savedInstanceState)
                  val scroll = ScrollView(this)
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }
                  scroll.addView(root)
                  setContentView(scroll)
                  buildUI()
              }

              private fun applyTheme() {
                  val mode = when (settings.themeMode) {
                      "light" -> AppCompatDelegate.MODE_NIGHT_NO
                      "dark" -> AppCompatDelegate.MODE_NIGHT_YES
                      else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                  }
                  AppCompatDelegate.setDefaultNightMode(mode)
              }

              private fun buildUI() {
                  root.removeAllViews()
                  root.addView(TextView(this).apply {
                      text = "Ajustes"; textSize = 28f
