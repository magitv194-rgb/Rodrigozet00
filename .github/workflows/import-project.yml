name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cachear keystore de firma
        uses: actions/cache@v4
        with:
          path: ~/.android/release.keystore
          key: keystore-v1

      - name: Generar keystore si no existe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/release.keystore \
              -alias subtitulos \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass subtitulos2024 -keypass subtitulos2024 \
              -dname "CN=SubtitulosLive, OU=Personal, O=Personal, L=NA, S=NA, C=AR"
          fi

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/subtitulos/live
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'__EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SubtitulosLive"
          include(":app")
          __EOF__

          cat > build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF__

          cat > gradle.properties <<'__EOF__'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          __EOF__

          cat > app/proguard-rules.pro <<'__EOF__'
          -keepclasseswithmembernames class * { native <methods>; }
          -keep class org.vosk.** { *; }
          -keep class com.sun.jna.** { *; }
          -dontwarn org.vosk.**
          -dontwarn com.sun.jna.**
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          __EOF__

          cat > app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.subtitulos.live"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.subtitulos.live"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = (System.getenv("VERSION_CODE") ?: "1").toInt()
                  versionName = System.getenv("VERSION_NAME") ?: "2.2.0"
                  resourceConfigurations += listOf("es", "en")
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("debug")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              packaging {
                  jniLibs { useLegacyPackaging = true }
                  resources { excludes += listOf("/META-INF/{AL2.0,LGPL2.1}") }
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.alphacephei:vosk-android:0.3.75@aar")
              implementation("net.java.dev.jna:jna:5.14.0@aar")
              implementation("com.google.mlkit:translate:17.0.3")
          }
          __EOF__

          cat > app/src/main/res/values/strings.xml <<'__EOF__'
