                              .setSourceLanguage(source.translateCode)
                              .setTargetLanguage(target.translateCode).build()
                      )
                      showSubtitle(getString(R.string.msg_preparing_translation))
                      translator?.downloadModelIfNeeded(DownloadConditions.Builder().build())
                          ?.addOnSuccessListener {
                              modelReady = true
                              showSubtitle(getString(R.string.msg_listening_plus))
                          }
                          ?.addOnFailureListener {
                              showSubtitle(getString(R.string.msg_translation_error) + ": " + (it.message ?: ""))
                          }
                  }

                  captureJob = scope.launch { runCaptureLoop(source) }
                  return START_STICKY
              }

              private fun createInternalRecord(): AudioRecord {
                  val b = android.media.AudioPlaybackCaptureConfiguration.Builder(projection!!)
                  when (settings.audioFilter) {
                      "all" -> {
                          b.addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          b.addMatchingUsage(AudioAttributes.USAGE_GAME)
                          b.addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      }
                      "media" -> b.addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      else -> {
                          b.addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          b.addMatchingUsage(AudioAttributes.USAGE_GAME)
                      }
                  }
                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(16000)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                  val minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  return AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(b.build())
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(maxOf(minBuf * 2, 32768)).build()
              }

              private fun createMicRecord(): AudioRecord {
                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(16000)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                  val minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  return AudioRecord.Builder()
                      .setAudioSource(MediaRecorder.AudioSource.MIC)
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(maxOf(minBuf * 2, 32768)).build()
              }

              private fun runCaptureLoop(source: LanguageOption) {
                  var recognizer: Recognizer? = null
                  try {
                      val model = loadModel(source)
                      if (!running.get()) return
                      recognizer = Recognizer(model, 16000.0f)

                      val mode = settings.audioFilter
                      val useInternal = mode != "mic"
                      val useMic = mode == "mic" || mode == "mic_internal"

                      if (useInternal) {
                          try {
                              internalAudioRecord = createInternalRecord()
                          } catch (e: Exception) {
                              if (e.message?.contains("could not register audio policy") == true) {
                                  showSubtitle(getString(R.string.msg_capture_retry))
                                  Thread.sleep(500)
                                  internalAudioRecord = createInternalRecord()
                              } else throw e
                          }
                      }

                      if (useMic) {
                          micAudioRecord = createMicRecord()
                          if (AcousticEchoCanceler.isAvailable()) {
                              aec = AcousticEchoCanceler.create(micAudioRecord!!.audioSessionId)
                              aec?.enabled = true
                          }
                      }

                      internalAudioRecord?.startRecording()
                      micAudioRecord?.startRecording()

                      val bufferSize = 4096
                      val internalBuffer = ByteArray(bufferSize)
                      val micBuffer = ByteArray(bufferSize)
                      val mixedBuffer = ByteArray(bufferSize)

                      while (running.get() && scope.isActive) {
                          var bytesRead = 0
                          if (useInternal && useMic) {
                              val intRead = internalAudioRecord?.read(internalBuffer, 0, bufferSize) ?: 0
                              val micRead = micAudioRecord?.read(micBuffer, 0, bufferSize) ?: 0
                              bytesRead = minOf(intRead, micRead)
                              if (bytesRead > 0) {
                                  for (i in 0 until bytesRead step 2) {
                                      val s1 = ((internalBuffer[i].toInt() and 0xFF) or (internalBuffer[i + 1].toInt() shl 8)).toShort()
                                      val s2 = ((micBuffer[i].toInt() and 0xFF) or (micBuffer[i + 1].toInt() shl 8)).toShort()
                                      val mixed = ((s1 + s2) / 2).toShort()
                                      mixedBuffer[i] = (mixed.toInt() and 0xFF).toByte()
                                      mixedBuffer[i + 1] = ((mixed.toInt() shr 8) and 0xFF).toByte()
                                  }
                              }
                          } else if (useInternal) {
                              bytesRead = internalAudioRecord?.read(mixedBuffer, 0, bufferSize) ?: 0
                          } else if (useMic) {
                              bytesRead = micAudioRecord?.read(mixedBuffer, 0, bufferSize) ?: 0
                          }

                          if (bytesRead <= 0) continue

                          var maxAmplitude = 0
                          for (i in 0 until bytesRead) {
                              val abs = abs(mixedBuffer[i].toInt())
                              if (abs > maxAmplitude) maxAmplitude = abs
                          }
                          if (System.currentTimeMillis() - lastUiUpdate > 500) {
                              lastUiUpdate = System.currentTimeMillis()
                              mainHandler.post {
                                  if (subtitleView?.text?.contains("Nivel") == true || subtitleView?.text?.contains("Escuchando") == true) {
                                      subtitleView?.text = "Escuchando audio… (Nivel: $maxAmplitude)"
                                  }
                              }
                          }

                          val isFinal = recognizer.acceptWaveForm(mixedBuffer, bytesRead)
                          val json = JSONObject(if (isFinal) recognizer.result else recognizer.partialResult)
                          val key = if (isFinal) "text" else "partial"
                          val recognized = json.optString(key).trim()
                          
                          if (recognized.isNotBlank() && recognized != lastRecognized) {
                              lastRecognized = recognized
                              if (isFinal) {
                                  // Es una frase completa: traducir y hablar YA
                                  partialJob?.cancel()
                                  processText(recognized, true, source)
                              } else {
                                  // Es un parcial: mostrar rápido y programar traducción si se estanca
                                  showSubtitleThrottled(recognized, false)
                                  
                                  // Lógica para traducir el parcial si el usuario hace una pausa larga (ej. 1 seg)
                                  partialJob?.cancel()
                                  partialJob = scope.launch {
                                      kotlinx.coroutines.delay(800)
                                      if (running.get()) {
                                          processText(recognized, false, source)
                                      }
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      if (running.get()) showSubtitle(getString(R.string.msg_capture_error) + ": " + (e.localizedMessage ?: "?"))
                  } finally {
                      try { internalAudioRecord?.stop() } catch (_: Exception) {}
                      try { internalAudioRecord?.release() } catch (_: Exception) {}
                      try { micAudioRecord?.stop() } catch (_: Exception) {}
                      try { micAudioRecord?.release() } catch (_: Exception) {}
                      try { aec?.release() } catch (_: Exception) {}
                      try { recognizer?.close() } catch (_: Exception) {}
                  }
              }

              private fun processText(text: String, isFinal: Boolean, source: LanguageOption) {
                  val target = LANGS[settings.targetLang] ?: LANGS.values.first()

                  if (source.code == target.code) {
                      showSubtitleThrottled(formatSubtitle(text, null), isFinal)
                      if (isFinal) { recordEntry(text, null); speak(text) }
                      return
                  }

                  val dl = deepL
                  if (dl != null) {
                      scope.launch {
                          try {
                              val translated = dl.translate(text, source.code, target.code)
                              mainHandler.post {
                                  if (!running.get()) return@post
                                  showSubtitleThrottled(formatSubtitle(text, translated), isFinal)
                                  if (isFinal) { recordEntry(text, translated); speak(translated) }
                              }
                          } catch (_: Exception) {
                              mainHandler.post {
                                  if (running.get()) showSubtitleThrottled(formatSubtitle(text, null), isFinal)
                              }
                          }
                      }
                      return
                  }

                  val tr = translator
                  if (tr == null || !modelReady) {
                      showSubtitleThrottled(formatSubtitle(text, null), isFinal)
                      if (isFinal) { recordEntry(text, null); speak(text) }
                      return
                  }
                  tr.translate(text).addOnSuccessListener { translated ->
                      if (running.get()) {
                          showSubtitleThrottled(formatSubtitle(text, translated), isFinal)
                          if (isFinal) { recordEntry(text, translated); speak(translated) }
                      }
                  }.addOnFailureListener {
                      showSubtitleThrottled(formatSubtitle(text, null), isFinal)
                  }
              }

              private fun formatSubtitle(original: String, translated: String?): String {
                  return when (settings.subtitleMode) {
                      "original" -> original
                      "translated" -> translated ?: original
                      else -> if (translated != null && translated != original) "$original\n$translated" else original
                  }
              }

              private fun recordEntry(original: String, translated: String?) {
                  val now = System.currentTimeMillis()
                  if (original.isNotBlank()) {
                      subtitleLog.add(SubtitleEntry(lastFinalTime, now, original, translated))
                      lastFinalTime = now
                  }
                  lastOriginal = original
                  lastTranslated = translated
              }

              private fun showSubtitleThrottled(text: String, force: Boolean) {
                  val now = System.currentTimeMillis()
                  if (force || now - lastUiUpdate > 120) { lastUiUpdate = now; showSubtitle(text) }
              }

              private fun speak(text: String) {
                  if (!settings.voiceEnabled || !ttsReady || text.isBlank()) return
                  
                  // Forzar el volumen del stream de música al máximo para que se escuche bien
                  val audioManager = getSystemService(AudioManager::class.java)
                  val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                  audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxVol, 0)

                  val params = android.os.Bundle().apply {
                      putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, settings.ttsVolume / 100f)
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                  }
                  
                  // QUEUE_ADD en vez de QUEUE_FLUSH para que no corte la palabra a la mitad
                  tts?.speak(text, TextToSpeech.QUEUE_ADD, params, "sub-${System.currentTimeMillis()}")
              }

              private fun startForegroundNotification() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(
                      "subtitles_live", getString(R.string.notif_channel), NotificationManager.IMPORTANCE_LOW))
                  val notif = Notification.Builder(this, "subtitles_live")
                      .setContentTitle(getString(R.string.notif_title))
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else startForeground(1, notif)
              }

              private fun createOverlay() {
                  if (!Settings.canDrawOverlays(this)) { showToast(getString(R.string.msg_overlay_perm)); return }
                  val metrics = resources.displayMetrics
                  val wm = getSystemService(WindowManager::class.java)

                  val subtitleTextView = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = sizes[settings.subtitleSizeIndex.coerceIn(0, sizes.lastIndex)]
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xCC000000.toInt())
                      setPadding(20, 14, 20, 14)
                      text = getString(R.string.msg_preparing)
                  }

                  val smaller = Button(this).apply {
                      text = getString(R.string.btn_smaller)
                      setOnClickListener {
                          settings.subtitleSizeIndex = (settings.subtitleSizeIndex - 1).coerceAtLeast(0)
                          subtitleTextView.textSize = sizes[settings.subtitleSizeIndex]
                      }
                  }
                  val larger = Button(this).apply {
                      text = getString(R.string.btn_larger)
                      setOnClickListener {
                          settings.subtitleSizeIndex = (settings.subtitleSizeIndex + 1).coerceAtMost(sizes.lastIndex)
                          subtitleTextView.textSize = sizes[settings.subtitleSizeIndex]
                      }
                  }
                  val voice = Button(this).apply {
                      text = if (settings.voiceEnabled) getString(R.string.btn_voice_on) else getString(R.string.btn_voice_off)
                      setOnClickListener {
                          settings.voiceEnabled = !settings.voiceEnabled
                          text = if (settings.voiceEnabled) getString(R.string.btn_voice_on) else getString(R.string.btn_voice_off)
                          if (!settings.voiceEnabled) try { tts?.stop() } catch (_: Exception) {}
                      }
                  }
                  val stop = Button(this).apply {
                      text = getString(R.string.btn_stop)
                      setOnClickListener { stopSelf() }
                  }

                  val buttonRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xEE171717.toInt())
                      addView(smaller); addView(larger); addView(voice); addView(stop)
                  }

                  val toggle = Button(this).apply {
                      text = getString(R.string.btn_hide)
                      setOnClickListener {
                          val visible = buttonRow.visibility == View.VISIBLE
                          buttonRow.visibility = if (visible) View.GONE else View.VISIBLE
                          text = getString(if (visible) R.string.btn_show else R.string.btn_hide)
                      }
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xCC000000.toInt())
                      addView(subtitleTextView); addView(toggle); addView(buttonRow)
                  }

                  val params = WindowManager.LayoutParams(
                      (metrics.widthPixels * 0.94f).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = if (settings.overlayX < 0) (metrics.widthPixels * 0.03f).toInt() else settings.overlayX
                      y = if (settings.overlayY < 0) metrics.heightPixels / 2 else settings.overlayY
                  }

                  var downX = 0f; var downY = 0f; var startX = 0; var startY = 0
                  subtitleTextView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX; downY = event.rawY
                              startX = params.x; startY = params.y; true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - downX).toInt()
                              params.y = startY + (event.rawY - downY).toInt()
                              try { wm.updateViewLayout(container, params) } catch (_: Exception) {}
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              settings.overlayX = params.x; settings.overlayY = params.y; true
                          }
                          else -> false
                      }
                  }

                  try {
                      wm.addView(container, params)
                      overlay = container; subtitleView = subtitleTextView; windowParams = params
                  } catch (e: Exception) {
                      showToast(getString(R.string.msg_overlay_fail, e.message ?: "?"))
                  }
              }

              private fun showToast(msg: String) {
                  mainHandler.post {
                      try { Toast.makeText(this@CaptureService, msg, Toast.LENGTH_LONG).show() } catch (_: Exception) {}
                  }
              }

              private fun showSubtitle(text: String) {
                  mainHandler.post { if (running.get()) subtitleView?.text = text }
              }

              private fun loadModel(source: LanguageOption): Model {
                  val dir = File(filesDir, "vosk-${source.code}${if (settings.useLargeModel) "-large" else ""}")
                  val modelName = if (settings.useLargeModel) source.largeModel else source.smallModel
                  if (!File(dir, "am").isDirectory) downloadModel(dir, modelName)
                  
                  return try {
                      Model(dir.absolutePath)
                  } catch (e: Exception) {
                      if (settings.useLargeModel) {
                          mainHandler.post { showToast(getString(R.string.msg_oom_error)) }
                          settings.useLargeModel = false // Fallback al modelo pequeño
                          val smallDir = File(filesDir, "vosk-${source.code}")
                          if (!File(smallDir, "am").isDirectory) downloadModel(smallDir, source.smallModel)
                          try { Model(smallDir.absolutePath) } catch (_: Exception) {
                              smallDir.deleteRecursively(); downloadModel(smallDir, source.smallModel); Model(smallDir.absolutePath)
                          }
                      } else {
                          dir.deleteRecursively(); downloadModel(dir, modelName); Model(dir.absolutePath)
                      }
                  }
              }

              private fun downloadModel(destination: File, modelName: String) {
                  showSubtitle(getString(R.string.msg_downloading_model))
                  val tempDir = File(filesDir, "tmp-${destination.name}")
                  tempDir.deleteRecursively(); tempDir.mkdirs()
                  val zipFile = File(cacheDir, "${destination.name}.zip")
                  URL("https://alphacephei.com/vosk/models/$modelName.zip").openStream().use { input ->
                      zipFile.outputStream().use { output -> input.copyTo(output) }
                  }
                  ZipInputStream(zipFile.inputStream()).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          val out = File(tempDir, entry.name)
                          if (!out.canonicalPath.startsWith(tempDir.canonicalPath + File.separator)) {
                              throw SecurityException("Zip inseguro")
                          }
                          if (entry.isDirectory) out.mkdirs()
                          else { out.parentFile?.mkdirs(); out.outputStream().use { zip.copyTo(it) } }
                          zip.closeEntry(); entry = zip.nextEntry
                      }
                  }
                  zipFile.delete()
                  val root = tempDir.walkTopDown().firstOrNull { File(it, "am").isDirectory }
                      ?: throw IllegalStateException("Modelo incompleto")
                  destination.deleteRecursively()
                  if (!root.renameTo(destination)) root.copyRecursively(destination, overwrite = true)
                  tempDir.deleteRecursively()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  try {
                      val m = resources.displayMetrics
                      overlay?.let { v -> windowParams?.let { p ->
                          p.width = (m.widthPixels * 0.94f).toInt()
                          getSystemService(WindowManager::class.java).updateViewLayout(v, p)
                      } }
                  } catch (_: Exception) {}
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  stopSelf(); super.onTaskRemoved(rootIntent)
              }

              private fun cleanup() {
                  running.set(false)
                  captureJob?.cancel(); captureJob = null
                  partialJob?.cancel(); partialJob = null
                  try { internalAudioRecord?.stop() } catch (_: Exception) {}
                  try { internalAudioRecord?.release() } catch (_: Exception) {}
                  internalAudioRecord = null
                  try { micAudioRecord?.stop() } catch (_: Exception) {}
                  try { micAudioRecord?.release() } catch (_: Exception) {}
                  micAudioRecord = null
                  try { aec?.release() } catch (_: Exception) {}
                  aec = null
                  try { projection?.stop() } catch (_: Exception) {}
                  projection = null
                  try { translator?.close() } catch (_: Exception) {}
                  translator = null
                  deepL = null
                  try { tts?.stop() } catch (_: Exception) {}
                  try { tts?.shutdown() } catch (_: Exception) {}
                  tts = null; ttsReady = false
                  try {
                      overlay?.let { getSystemService(WindowManager::class.java).removeView(it) }
                  } catch (_: Exception) {}
                  overlay = null; subtitleView = null; windowParams = null
              }

              override fun onDestroy() {
                  try {
                      if (::settings.isInitialized && settings.autoExportSrt && subtitleLog.isNotEmpty()) {
                          val path = SrtExporter.save(this, subtitleLog)
                          showToast(getString(R.string.msg_srt_saved, path))
                      }
                  } catch (_: Exception) {}
                  cleanup()
                  scope.cancel()
                  super.onDestroy()
              }
          }
          __EOF__

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (release con R8)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "3.1.${{ github.run_number }}"
        run: gradle assembleRelease --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosLive-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
