          cat > app/src/main/java/com/subtitulos/live/GoogleTranslateClient.kt <<'__EOF__'
          package com.subtitulos.live

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import java.io.IOException
          import java.net.URLEncoder

          class GoogleTranslateClient {
              private val client = OkHttpClient()

              suspend fun translate(text: String, sourceCode: String, targetCode: String): String =
                  withContext(Dispatchers.IO) {
                      val encodedText = URLEncoder.encode(text, "UTF-8")
                      val url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$sourceCode&tl=$targetCode&dt=t&q=$encodedText"
                      val request = Request.Builder()
                          .url(url)
                          .addHeader("User-Agent", "Mozilla/5.0")
                          .build()

                      client.newCall(request).execute().use { response ->
                          if (!response.isSuccessful) throw IOException("Error de red: ${response.code}")
                          val responseBody = response.body?.string() ?: throw IOException("Respuesta vacía")
                          
                          val jsonArray = JSONArray(responseBody)
                          val translationsArray = jsonArray.getJSONArray(0)
                          val sb = StringBuilder()
                          
                          for (i in 0 until translationsArray.length()) {
                              val part = translationsArray.getJSONArray(i)
                              if (part.length() > 0 && !part.isNull(0)) {
                                  sb.append(part.getString(0))
                              }
                          }
                          sb.toString()
                      }
                  }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/SrtExporter.kt <<'__EOF__'
          package com.subtitulos.live

          import android.content.ContentValues
          import android.content.Context
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class SubtitleEntry(val startMs: Long, val endMs: Long, val original: String, val translated: String?)

          object SrtExporter {
              fun save(context: Context, entries: List<SubtitleEntry>): String {
                  val filename = "subtitulos-${SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())}.srt"
                  val content = buildString {
                      entries.forEachIndexed { i, e ->
                          append("${i + 1}\n")
                          append("${fmt(e.startMs)} --> ${fmt(e.endMs)}\n")
                          if (e.translated.isNullOrBlank()) append("${e.original}\n")
                          else append("${e.original}\n${e.translated}\n")
                          append("\n")
                      }
                  }
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, filename)
                      put(MediaStore.Downloads.MIME_TYPE, "application/x-subrip")
                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                  }
                  val uri = context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: throw IOException("No se pudo crear el archivo")
                  context.contentResolver.openOutputStream(uri)!!.use { it.write(content.toByteArray()) }
                  return "Descargas/$filename"
              }

              private fun fmt(ms: Long): String {
                  val h = ms / 3_600_000; val m = (ms % 3_600_000) / 60_000
                  val s = (ms % 60_000) / 1_000; val milli = ms % 1_000
                  return String.format(Locale.US, "%02d:%02d:%02d,%03d", h, m, s, milli)
              }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/MainActivity.kt <<'__EOF__'
          package com.subtitulos.live

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate
          import androidx.core.content.ContextCompat
          import com.google.android.material.button.MaterialButton

          class MainActivity : AppCompatActivity() {
              private lateinit var settings: AppSettings
              private lateinit var sourceSpinner: Spinner
              private lateinit var targetSpinner: Spinner
              private var pendingStart = false

              private val captureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val data = result.data
                  if (result.resultCode == RESULT_OK && data != null) {
                      ContextCompat.startForegroundService(
                          this,
                          Intent(this, CaptureService::class.java).apply {
                              putExtra("resultCode", result.resultCode)
                              putExtra("projectionData", data)
                          }
                      )
                      moveTaskToBack(true)
                  }
              }

              private val overlayLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { if (Settings.canDrawOverlays(this)) continueStart() }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { grants -> if (grants[Manifest.permission.RECORD_AUDIO] == true) continueStart() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  settings = AppSettings(this)
                  applyTheme()
                  super.onCreate(savedInstanceState)

                  sourceSpinner = makeSpinner(LANGS.keys.indexOf(settings.sourceLang).coerceAtLeast(0))
                  targetSpinner = makeSpinner(LANGS.keys.indexOf(settings.targetLang).coerceAtLeast(0))

                  val title = TextView(this).apply {
                      text = getString(R.string.title); textSize = 26f
                      gravity = Gravity.CENTER; setPadding(0, 40, 0, 60)
                  }
                  val sourceLabel = TextView(this).apply { text = getString(R.string.label_source); textSize = 14f }
                  val targetLabel = TextView(this).apply { text = getString(R.string.label_target); textSize = 14f }
                  val startButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_start)
                      setOnClickListener { startCapture() }
                  }
                  val settingsButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_settings)
                      setOnClickListener {
                          startActivity(Intent(this@MainActivity, SettingsActivity::class.java))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 16 }
                  }
                  val stopButton = MaterialButton(this).apply {
                      text = getString(R.string.btn_stop)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 8 }
                  }

                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(60, 60, 60, 60)
                      listOf(title, sourceLabel, sourceSpinner, targetLabel, targetSpinner,
                          startButton, settingsButton, stopButton).forEach { addView(it) }
                  })
              }

              private fun applyTheme() {
                  val mode = when (settings.themeMode) {
                      "light" -> AppCompatDelegate.MODE_NIGHT_NO
                      "dark" -> AppCompatDelegate.MODE_NIGHT_YES
                      else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                  }
                  AppCompatDelegate.setDefaultNightMode(mode)
              }

              private fun makeSpinner(selected: Int): Spinner = Spinner(this).apply {
                  adapter = ArrayAdapter(this@MainActivity,
                      android.R.layout.simple_spinner_dropdown_item, LANGS.keys.toList())
                  setSelection(selected.coerceIn(0, LANGS.size - 1))
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = 8; bottomMargin = 24 }
              }

              private fun startCapture() { pendingStart = true; continueStart() }

              private fun continueStart() {
                  if (!pendingStart) return
                  if (!Settings.canDrawOverlays(this)) {
                      overlayLauncher.launch(Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")))
                      return
                  }
                  val audioOk = ContextCompat.checkSelfPermission(
                      this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  if (!audioOk) {
                      permissionLauncher.launch(arrayOf(
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.POST_NOTIFICATIONS))
                      return
                  }
                  pendingStart = false
                  settings.sourceLang = sourceSpinner.selectedItem as String
                  settings.targetLang = targetSpinner.selectedItem as String
                  captureLauncher.launch(
                      getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent())
              }
          }
          __EOF__

          cat > app/src/main/java/com/subtitulos/live/SettingsActivity.kt <<'__EOF__'
          package com.subtitulos.live

          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate
          import com.google.android.material.button.MaterialButton

          class SettingsActivity : AppCompatActivity() {
              private lateinit var settings: AppSettings
              private lateinit var root: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  settings = AppSettings(this)
                  applyTheme()
                  super.onCreate(savedInstanceState)
                  val scroll = ScrollView(this)
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }
                  scroll.addView(root)
                  setContentView(scroll)
                  buildUI()
              }

              private fun applyTheme() {
                  val mode = when (settings.themeMode) {
                      "light" -> AppCompatDelegate.MODE_NIGHT_NO
                      "dark" -> AppCompatDelegate.MODE_NIGHT_YES
                      else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                  }
                  AppCompatDelegate.setDefaultNightMode(mode)
              }

              private fun buildUI() {
                  root.removeAllViews()
                  root.addView(TextView(this).apply {
                      text = "Ajustes"; textSize = 28f
                      setPadding(0, 0, 0, 32)
                  })

                  section("Fuente de audio")
                  val audioGroup = RadioGroup(this)
                  val internalRadio = RadioButton(this).apply { text = "Solo audio interno"; id = 1 }
                  val micRadio = RadioButton(this).apply { text = "Solo micrófono"; id = 2 }
                  val bothRadio = RadioButton(this).apply { text = "Micrófono + Audio interno"; id = 3 }
                  val allRadio = RadioButton(this).apply { text = "Todo (Multimedia + Juegos)"; id = 4 }
                  
                  audioGroup.addView(internalRadio); audioGroup.addView(micRadio)
                  audioGroup.addView(bothRadio); audioGroup.addView(allRadio)
                  
                  when (settings.audioFilter) {
                      "mic" -> micRadio.isChecked = true
                      "mic_internal" -> bothRadio.isChecked = true
                      "all" -> allRadio.isChecked = true
                      else -> internalRadio.isChecked = true
                  }
                  audioGroup.setOnCheckedChangeListener { _, id ->
                      settings.audioFilter = when (id) { 
                          2 -> "mic"; 3 -> "mic_internal"; 4 -> "all"; else -> "media" 
                      }
                  }
                  root.addView(audioGroup)

                  section("Voz (TTS)")
                  root.addView(switchRow("Leer en voz alta", settings.voiceEnabled) {
                      settings.voiceEnabled = it
                  })
                  root.addView(sliderRow("Velocidad", 5f, 20f, settings.ttsSpeed * 10f) { v ->
                      settings.ttsSpeed = v / 10f
                  })
                  root.addView(sliderRow("Volumen", 0f, 100f, settings.ttsVolume.toFloat()) { v ->
                      settings.ttsVolume = v.toInt()
                  })

                  section("Subtítulos")
                  val modeGroup = RadioGroup(this)
                  val bothSubRadio = RadioButton(this).apply { text = "Original + traducción"; id = 1 }
                  val origRadio = RadioButton(this).apply { text = "Solo original"; id = 2 }
                  val transRadio = RadioButton(this).apply { text = "Solo traducción"; id = 3 }
                  modeGroup.addView(bothSubRadio); modeGroup.addView(origRadio); modeGroup.addView(transRadio)
                  when (settings.subtitleMode) {
                      "original" -> origRadio.isChecked = true
                      "translated" -> transRadio.isChecked = true
                      else -> bothSubRadio.isChecked = true
                  }
                  modeGroup.setOnCheckedChangeListener { _, id ->
                      settings.subtitleMode = when (id) { 2 -> "original"; 3 -> "translated"; else -> "both" }
                  }
                  root.addView(modeGroup)
                  root.addView(sliderRow("Tamaño", 0f, 5f, settings.subtitleSizeIndex.toFloat()) { v ->
                      settings.subtitleSizeIndex = v.toInt()
                  })

                  section("Tema")
                  val themeGroup = RadioGroup(this)
                  val autoRadio = RadioButton(this).apply { text = "Automático"; id = 1 }
