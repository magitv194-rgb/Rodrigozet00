          data class LanguageOption(
              val code: String,
              val smallModel: String,
              val largeModel: String,
              val translateCode: String,
              val ttsLocale: Locale
          )

          fun deeplSource(code: String): String = when (code) {
              "zh" -> "ZH"; "pt" -> "PT"; "en" -> "EN"; else -> code.uppercase()
          }

          fun deeplTarget(code: String): String = when (code) {
              "zh" -> "ZH"; "pt" -> "PT-BR"; "en" -> "EN-US"; else -> code.uppercase()
