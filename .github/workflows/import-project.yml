name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: crear proyecto
        run: |
          mkdir -p "."
          cat > "settings.gradle.kts" <<'__EOF__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SubtitulosLive"
          include(":app")
          __EOF__
          mkdir -p "."
          cat > "build.gradle.kts" <<'__EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF__
          mkdir -p "."
          cat > "gradle.properties" <<'__EOF__'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          __EOF__
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.subtitulos.live"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.subtitulos.live"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.alphacephei:vosk-android:0.3.47")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.google.mlkit:translate:17.0.3")
          }
          __EOF__
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'__EOF__'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Subtítulos Live" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
              </application>
          </manifest>
          __EOF__
          mkdir -p "app/src/main/java/com/subtitulos/live"
          cat > "app/src/main/java/com/subtitulos/live/MainActivity.kt" <<'__EOF__'
          package com.subtitulos.live

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var spOri: Spinner
              private lateinit var spDes: Spinner

              private fun spinner(sel: Int) = Spinner(this).apply {
                  adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, LANGS.keys.toList())
                  setSelection(sel)
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  spOri = spinner(1)
                  spDes = spinner(0)
                  val t1 = TextView(this).apply { text = "Idioma que se escucha:"; gravity = Gravity.CENTER }
                  val t2 = TextView(this).apply { text = "Traducir a:"; gravity = Gravity.CENTER }
                  val go = Button(this).apply { text = "Iniciar subtítulos"; setOnClickListener { start() } }
                  val stop = Button(this).apply {
                      text = "Detener"
                      setOnClickListener { stopService(Intent(this@MainActivity, CaptureService::class.java)) }
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(48, 48, 48, 48)
                      listOf(t1, spOri, t2, spDes, go, stop).forEach { addView(it) }
                  })
              }

              private fun start() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS), 0)
                      return
                  }
                  startActivityForResult(getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent(), 1)
              }

              override fun onRequestPermissionsResult(rq: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(rq, p, r)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) start()
              }

              override fun onActivityResult(rq: Int, rc: Int, d: Intent?) {
                  super.onActivityResult(rq, rc, d)
                  if (rq == 1 && rc == RESULT_OK && d != null) {
                      startForegroundService(
                          Intent(this, CaptureService::class.java)
                              .putExtra("rc", rc).putExtra("data", d)
                              .putExtra("src", spOri.selectedItem as String)
                              .putExtra("dst", spDes.selectedItem as String)
                      )
                      moveTaskToBack(true)
                  }
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/subtitulos/live"
          cat > "app/src/main/java/com/subtitulos/live/CaptureService.kt" <<'__EOF__'
          package com.subtitulos.live

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.*
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import java.io.File
          import java.net.URL
          import java.util.zip.ZipInputStream
          import kotlin.concurrent.thread

          val LANGS = linkedMapOf(
              "Español" to Triple("es", "vosk-model-small-es-0.42", TranslateLanguage.SPANISH),
              "Inglés" to Triple("en", "vosk-model-small-en-us-0.15", TranslateLanguage.ENGLISH),
              "Portugués" to Triple("pt", "vosk-model-small-pt-0.3", TranslateLanguage.PORTUGUESE),
              "Francés" to Triple("fr", "vosk-model-small-fr-0.22", TranslateLanguage.FRENCH),
              "Alemán" to Triple("de", "vosk-model-small-de-0.15", TranslateLanguage.GERMAN),
              "Italiano" to Triple("it", "vosk-model-small-it-0.22", TranslateLanguage.ITALIAN),
              "Ruso" to Triple("ru", "vosk-model-small-ru-0.22", TranslateLanguage.RUSSIAN),
              "Japonés" to Triple("ja", "vosk-model-small-ja-0.22", TranslateLanguage.JAPANESE),
              "Coreano" to Triple("ko", "vosk-model-small-ko-0.22", TranslateLanguage.KOREAN),
              "Chino" to Triple("zh", "vosk-model-small-cn-0.22", TranslateLanguage.CHINESE),
          )

          class CaptureService : Service() {
              private var run = false
              private var rec: AudioRecord? = null
              private var mp: MediaProjection? = null
              private var tv: TextView? = null
              private var last = ""
              private var ready = false
              private val ui = Handler(Looper.getMainLooper())

              override fun onBind(i: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i == null) return START_NOT_STICKY
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("sub", "Subtítulos", NotificationManager.IMPORTANCE_LOW))
                  startForeground(
                      1,
                      Notification.Builder(this, "sub").setContentTitle("Subtítulos en vivo activos")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now).build(),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                  )
                  val (lc, modelName, srcLang) = LANGS[i.getStringExtra("src") ?: ""] ?: LANGS.values.first()
                  val dstLang = LANGS[i.getStringExtra("dst") ?: ""]?.third ?: TranslateLanguage.SPANISH
                  val proj = getSystemService(MediaProjectionManager::class.java)
                      .getMediaProjection(i.getIntExtra("rc", 0), i.getParcelableExtra<Intent>("data")!!)
                  proj.registerCallback(object : MediaProjection.Callback() {}, null)
                  mp = proj
                  overlay()

                  val tr = if (srcLang == dstLang) null else Translation.getClient(
                      TranslatorOptions.Builder().setSourceLanguage(srcLang).setTargetLanguage(dstLang).build()
                  )
                  if (tr == null) {
                      ready = true
                  } else {
                      say("Preparando traductor…")
                      tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                          .addOnSuccessListener { ready = true }
                          .addOnFailureListener { say("Error traductor: ${it.message}") }
                  }

                  run = true
                  thread {
                      try {
                          val recog = Recognizer(loadModel(lc, modelName), 16000f)
                          val cfg = AudioPlaybackCaptureConfiguration.Builder(proj)
                              .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                              .addMatchingUsage(AudioAttributes.USAGE_GAME)
                              .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN).build()
                          val r = AudioRecord.Builder().setAudioPlaybackCaptureConfig(cfg)
                              .setAudioFormat(
                                  AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(16000).setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                              ).setBufferSizeInBytes(32000).build()
                          rec = r
                          r.startRecording()
                          say("Escuchando…")
                          val buf = ByteArray(4096)
                          while (run) {
                              val n = r.read(buf, 0, buf.size)
                              if (n <= 0) continue
                              val fin = recog.acceptWaveForm(buf, n)
                              val t = JSONObject(if (fin) recog.result else recog.partialResult)
                                  .optString(if (fin) "text" else "partial")
                              if (t.isNotBlank() && t != last) {
                                  last = t
                                  val shown = if (lc == "ja" || lc == "zh") t.replace(" ", "") else t
                                  ui.post {
                                      if (tr == null) {
                                          tv?.text = shown
                                      } else if (ready) {
                                          tr.translate(shown).addOnSuccessListener { tv?.text = "$shown\n→ $it" }
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          say("Error: ${e.message}")
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun loadModel(lc: String, name: String): Model {
                  val dir = File(filesDir, "model-$lc")
                  if (!dir.exists()) {
                      say("Descargando modelo de voz (una sola vez)…")
                      val zip = File(cacheDir, "m.zip")
                      URL("https://alphacephei.com/vosk/models/$name.zip").openStream().use { i -> zip.outputStream().use { i.copyTo(it) } }
                      ZipInputStream(zip.inputStream()).use { z ->
                          var e = z.nextEntry
                          while (e != null) {
                              val rel = e.name.substringAfter('/')
                              if (rel.isNotEmpty()) {
                                  val f = File(dir, rel)
                                  if (!f.canonicalPath.startsWith(dir.canonicalPath)) throw SecurityException("zip inválido")
                                  if (e.isDirectory) f.mkdirs() else { f.parentFile!!.mkdirs(); f.outputStream().use { z.copyTo(it) } }
                              }
                              e = z.nextEntry
                          }
                      }
                      zip.delete()
                  }
                  return Model(dir.path)
              }

              private fun overlay() {
                  val t = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 20f; gravity = Gravity.CENTER
                      setBackgroundColor(0xAA000000.toInt()); setPadding(24, 16, 24, 16)
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.BOTTOM; lp.y = 250
                  getSystemService(WindowManager::class.java).addView(t, lp)
                  tv = t
              }

              private fun say(s: String) { ui.post { tv?.text = s } }

              override fun onDestroy() {
                  run = false
                  rec?.release(); mp?.stop()
                  tv?.let { getSystemService(WindowManager::class.java).removeView(it) }
                  super.onDestroy()
              }
          }
          __EOF__
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: SubtitulosLive-apk, path: app/build/outputs/apk/debug/app-debug.apk }
